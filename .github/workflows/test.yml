# Тесты на каждый push и pull request: в main попадает только то, что проходит npm test.
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oche
          POSTGRES_PASSWORD: oche
          POSTGRES_DB: oche_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U oche" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://oche:oche@127.0.0.1:5432/oche_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
