* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 0 calc(90px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  min-height: 100dvh;
  overflow-x: hidden;
  transition: background-color .2s ease, color .2s ease;
}
@media (min-width: 768px) {
  body {
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
}
@media (min-width: 900px) {
  body {
    padding-block: 0 56px;
    padding-left: max(28px, env(safe-area-inset-left, 0px));
    padding-right: max(28px, env(safe-area-inset-right, 0px));
  }
}
button, input, [role="button"], [data-act] {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; transition: all .15s ease; user-select: none; }
button:focus-visible, input:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.meta { color: var(--muted); font-size: 13px; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 15px; height: 15px; stroke-width: 2.2; }

.top-wrap {
  position: sticky; top: 0; z-index: 10;
  margin-inline: calc(-1 * max(12px, env(safe-area-inset-left, 0px)));
  padding-inline: max(12px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  margin-bottom: 16px;
}
@media (min-width: 768px) {
  .top-wrap {
    margin-inline: calc(-1 * max(20px, env(safe-area-inset-left, 0px)));
    padding-inline: max(20px, env(safe-area-inset-left, 0px));
  }
}
@media (min-width: 900px) {
  .top-wrap {
    margin-inline: calc(-1 * max(28px, env(safe-area-inset-left, 0px)));
    padding-inline: max(28px, env(safe-area-inset-left, 0px));
    margin-bottom: 22px;
  }
}
.top { max-width: 1140px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
.brand svg { width: 29px; height: 29px; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { color: var(--fg); border-color: var(--line-bright); background: var(--surface2); }
.nav { display: none; gap: 4px; align-items: center; margin-left: auto; margin-right: 8px; }
.nav button { padding: 8px 14px; border-radius: 9px; color: var(--muted); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.nav button:hover { color: var(--fg); background: color-mix(in srgb, var(--surface2) 55%, transparent); }
.nav button.on { color: var(--fg); background: var(--surface2); box-shadow: inset 0 0 0 1px var(--line); }
.nav button.cta { background: var(--green); color: var(--green-ink); font-family: var(--display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 7px 16px; margin: 0 4px; box-shadow: 0 4px 14px var(--green-glow); }
.nav button.cta:hover { filter: brightness(1.08); transform: translateY(-1px); }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabs button { display: grid; justify-items: center; gap: 3px; padding: 5px 2px; font-size: 11px; color: var(--muted); border-radius: 8px; text-align: center; font-weight: 500; }
.tabs button.on { color: var(--fg); }
.tabs button.on .ic { color: var(--green); }
.tabs button.play .ic { width: 40px; height: 40px; padding: 8px; margin-top: -16px; border-radius: 50%; background: var(--green); color: var(--green-ink); box-shadow: 0 4px 12px var(--green-glow), 0 0 0 4px var(--surface); }
@media (min-width: 900px) { .nav { display: flex; } .tabs { display: none; } }

.wrap { max-width: 1140px; margin: 0 auto; display: grid; gap: 20px; }
.narrow { max-width: 680px; width: 100%; margin: 0 auto; display: grid; gap: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); pointer-events: none; background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 10px; z-index: 30; width: max-content; max-width: calc(100% - 32px); font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
@media (min-width: 900px) { .toast { bottom: 28px; } }
body.ingame .toast { bottom: auto; top: calc(8px + env(safe-area-inset-top, 0px)); }

.phead { display: flex; align-items: end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.h1 { font-family: var(--display); font-size: clamp(26px, 6vw, 42px); line-height: 1.04; text-transform: uppercase; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
.h2 { font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.sec { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; box-shadow: var(--shadow); }
@media (min-width: 640px) { .card { padding: 16px 18px; } }
.list { display: grid; gap: 10px; }
.fchips { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; align-items: center; padding-bottom: 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.fchips::-webkit-scrollbar { display: none; }
@media (min-width: 640px) { .fchips { flex-wrap: wrap; overflow-x: visible; } }
.fchip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; color: var(--muted); white-space: nowrap; flex: none; }
.fchip:hover { color: var(--fg); border-color: var(--line-bright); }
.fchip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pill.live { color: var(--green); font-weight: 600; }
.pill.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-glow); }
.lnk { color: var(--fg); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-bright); text-underline-offset: 3px; }
.lnk:hover { text-decoration-color: var(--green); color: var(--green); }
.pn { font-weight: 500; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pn:hover { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
.mini { padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); font-size: 12.5px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.mini:hover { color: var(--fg); border-color: var(--line-bright); }
.mini.go { background: var(--green); border-color: var(--green); color: var(--green-ink); font-weight: 600; }
.mini.go:hover { filter: brightness(1.08); }
.ghost { padding: 9px 14px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 13.5px; font-weight: 500; text-align: center; background: var(--surface); }
.ghost:hover { color: var(--fg); border-color: var(--line-bright); background: var(--surface2); }
.ghost.dng { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.ghost.dng:hover { background: var(--red-glow); }
.btn { width: 100%; padding: 14px 18px; border-radius: 11px; background: var(--green); color: var(--green-ink); font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; text-align: center; box-shadow: 0 4px 16px var(--green-glow); }
.btn:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); }
.btn.alt { background: var(--surface2); color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.btn.alt:hover:not(:disabled) { border-color: var(--line-bright); }
.btn.sm { width: auto; padding: 10px 18px; font-size: 16px; }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.note-box { padding: 13px 16px; border-radius: 12px; border: 1px dashed var(--line-bright); background: color-mix(in srgb, var(--surface) 65%, transparent); color: var(--muted); font-size: 13.5px; }
.note-box b { color: var(--fg); font-weight: 600; }
.av { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line-bright); color: var(--fg); font-family: var(--display); font-weight: 600; font-size: 14px; flex: none; }
.av.me { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.av.lg { width: 68px; height: 68px; font-size: 26px; }
.scroll { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scroll-snap-type: x proximity; }
.bk-col { scroll-snap-align: start; }
.more { justify-self: center; }

.fgrid { display: grid; gap: 22px; }
@media (min-width: 960px) { .fgrid { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.mc { display: grid; gap: 9px; transition: border-color .15s ease; }
.mc[role=button] { cursor: pointer; }
.mc[role=button]:hover { border-color: var(--line-bright); }
.mc-ctx { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--muted); }
.mc-ctx span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc-ctx .ic { color: var(--green); }
.mc-h { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
.mc-h time { margin-left: auto; flex: none; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.mc-rows { display: grid; gap: 5px; }
.mr { display: grid; grid-template-columns: minmax(0, 1fr) auto 2.2em; align-items: baseline; gap: 12px; color: var(--muted); }
.mr .pn, .mr > span:first-child { color: var(--muted); }
.mr .avg { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mr .lg { font-size: 22px; text-align: right; }
.mr.win .pn, .mr.win > span:first-child, .mr.win .lg { color: var(--fg); font-weight: 600; }
.mr.win .lg { color: var(--green); }
.mc-f { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.hl { padding: 2px 8px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--line); color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 500; }

.bk-col:not(:last-child) .bk-pair:not(.solo)::after { content: ""; box-sizing: border-box; position: absolute; right: calc(var(--bk-gap) / -2); width: calc(var(--bk-gap) / 2); top: calc(25% - 1px); bottom: calc(25% - 1px); border: 2px solid var(--line-bright); border-left: 0; border-radius: 0 8px 8px 0; pointer-events: none; }

.pg { --pg-w: 176px; display: grid; grid-template-columns: repeat(var(--pg-n), minmax(var(--pg-w), 1fr)); min-width: calc(var(--pg-n) * var(--pg-w)); border: 1px solid var(--line-bright); border-radius: 12px; overflow: hidden; background: var(--surface); }

<script>
const BOARD = [];
for (let n = 1; n <= 20; n++) {
  BOARD.push({ l: String(n), v: n, d: false, base: n, m: 1 });
  BOARD.push({ l: 'D' + n, v: 2 * n, d: true, base: n, m: 2 });

}
BOARD.push({ l: '25', v: 25, d: false, base: 25, m: 1 });
BOARD.push({ l: 'Bull', v: 50, d: true, base: 25, m: 2 });

const DOUBLE_PREF = ['D20','D16','D18','D12','D10','D8','D14','D6','D4','D2','D1','D19','D17','D15','D13','D11','D9','D7','D5','D3','Bull'];
const byLabel = l => BOARD.find(x => x.l === l);
const FINALS_DBL = DOUBLE_PREF.map(byLabel);
const FINALS_ANY = BOARD.slice().sort((a, b) => b.v - a.v);
const FIRST = BOARD.slice().sort((a, b) => (b.v - a.v) || (a.d - b.d));
const KIND_ORDER = x => (x.l[0] === 'T' ? 1 : x.d ? 2 : 0);
const IMPOSSIBLE = new Set([163, 166, 169, 172, 173, 175, 176, 178, 179]);
const cache = {};
// канонические закрытия на дубль 61–170 (проверено скриптом)
const CO3 = {170:'T20 T20 Bull',167:'T20 T19 Bull',164:'T20 T18 Bull',161:'T20 T17 Bull',160:'T20 T20 D20',158:'T20 T20 D19',157:'T20 T19 D20',156:'T20 T20 D18',155:'T20 T19 D19',154:'T20 T18 D20',153:'T20 T19 D18',152:'T20 T20 D16',151:'T20 T17 D20',150:'T20 T18 D18',149:'T20 T19 D16',148:'T20 T16 D20',147:'T20 T17 D18',146:'T20 T18 D16',145:'T20 T15 D20',144:'T20 T20 D12',143:'T20 T17 D16',142:'T20 T14 D20',141:'T20 T19 D12',140:'T20 T20 D10',139:'T20 T13 D20',138:'T20 T18 D12',137:'T20 T19 D10',136:'T20 T20 D8',135:'T20 T17 D12',134:'T20 T14 D16',133:'T20 T19 D8',132:'T20 T16 D12',131:'T20 T13 D16',130:'T20 T18 D8',129:'T19 T16 D12',128:'T18 T14 D16',127:'T20 T17 D8',126:'T19 T19 D6',125:'25 T20 D20',124:'T20 T16 D8',123:'T19 T16 D9',122:'T18 T18 D7',121:'T20 T11 D14',120:'T20 20 D20',119:'T19 T12 D13',118:'T20 18 D20',117:'T20 17 D20',116:'T20 16 D20',115:'T20 15 D20',114:'T20 14 D20',113:'T20 13 D20',112:'T20 12 D20',111:'T20 19 D16',110:'T20 Bull',109:'T20 9 D20',108:'T20 16 D16',107:'T19 Bull',106:'T20 10 D18',105:'T20 13 D16',104:'T18 Bull',103:'T19 6 D20',102:'T20 10 D16',101:'T17 Bull',100:'T20 D20',99:'T19 10 D16',98:'T20 D19',97:'T19 D20',96:'T20 D18',95:'T19 D19',94:'T18 D20',93:'T19 D18',92:'T20 D16',91:'T17 D20',90:'T20 D15',89:'T19 D16',88:'T20 D14',87:'T17 D18',86:'T18 D16',85:'T15 D20',84:'T20 D12',83:'T17 D16',82:'Bull D16',81:'T19 D12',80:'T20 D10',79:'T19 D11',78:'T18 D12',77:'T19 D10',76:'T20 D8',75:'T17 D12',74:'T14 D16',73:'T19 D8',72:'T16 D12',71:'T13 D16',70:'T18 D8',69:'T19 D6',68:'T20 D4',67:'T17 D8',66:'T10 D18',65:'T19 D4',64:'T16 D8',63:'T13 D12',62:'T10 D16',61:'T15 D8'};

function routeFor(rem, left, dbl) {
  if (rem < 1 || left < 1 || rem > (dbl ? 170 : 180)) return null;
  const key = rem + '|' + left + '|' + dbl;
  if (key in cache) return cache[key];
  const finals = dbl ? FINALS_DBL : FINALS_ANY;
  const min = dbl ? 2 : 1;
  let res = null;
  const one = r => finals.find(f => f.v === r) || null;
  // подводка без дублей и Bull, если такая есть
  const twoBy = (r, ok) => {
    for (const f of finals) {
      const a = r - f.v;
      if (a < 1) continue;
      const cands = BOARD.filter(x => x.v === a && ok(x)).sort((x, y) => KIND_ORDER(x) - KIND_ORDER(y));
      if (cands.length) return [cands[0], f];

function drawChart() {
  const el = $('chart');
  if (!el || !CHART) return;
  const d = CHART, W = Math.max(260, el.clientWidth), H = Math.max(150, el.clientHeight);
  if (d.length < 2) { el.innerHTML = '<p class="meta">Нужно хотя бы два матча для графика.</p>'; return; }
  const padL = 32, padR = 42, padT = 14, padB = 26;
  const vs = d.map(x => x.v);
  let lo = Math.max(0, Math.floor((Math.min(...vs) - 3) / 10) * 10), hi = Math.ceil((Math.max(...vs) + 3) / 10) * 10;
  if (hi <= lo) hi = lo + 20;
  const step = hi - lo > 40 ? 20 : 10;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => padL + i * (W - padL - padR) / (d.length - 1);
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">';
  for (let v = lo; v <= hi; v += step) s += '<line class="ch-grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ch-tick" x="' + (padL - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
  const line = d.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  s += '<path class="ch-area" d="' + line + ' L' + x(d.length - 1).toFixed(1) + ' ' + y(lo) + ' L' + padL + ' ' + y(lo) + ' Z"/>';
  s += '<path class="ch-line" d="' + line + '"/>';
  s += '<text class="ch-tick" x="' + padL + '" y="' + (H - 6) + '">' + fmtDate(d[0].t) + '</text><text class="ch-tick" x="' + (W - padR) + '" y="' + (H - 6) + '" text-anchor="end">' + fmtDate(d[d.length - 1].t) + '</text>';
  const L = d.length - 1;
  s += '<circle class="ch-dot" cx="' + x(L) + '" cy="' + y(d[L].v) + '" r="4.5"/><text class="ch-end" x="' + (x(L) + 8) + '" y="' + (y(d[L].v) + 4) + '">' + d[L].v.toFixed(1) + '</text>';
  s += '<g id="ch-h" style="display:none"><line class="ch-x" id="ch-hl" y1="' + padT + '" y2="' + (H - padB) + '"/><circle class="ch-dot" id="ch-hd" r="5"/></g>';
  s += '<rect id="ch-hit" x="' + padL + '" y="0" width="' + (W - padL - padR) + '" height="' + H + '" fill="transparent"/></svg><div class="tip" id="ch-tip" hidden></div>';
  el.innerHTML = s;
  const hit = $('ch-hit'), g = $('ch-h'), tip = $('ch-tip');
  const show = e => {
    const r = el.getBoundingClientRect();
    const px = e.clientX - r.left;
    const i = Math.max(0, Math.min(L, Math.round((px - padL) / ((W - padL - padR) / L))));
    const p = d[i];
    g.style.display = '';
    $('ch-hl').setAttribute('x1', x(i)); $('ch-hl').setAttribute('x2', x(i));
    $('ch-hd').setAttribute('cx', x(i)); $('ch-hd').setAttribute('cy', y(p.v));
    tip.hidden = false;
    tip.innerHTML = '<b>ср. ' + p.v.toFixed(1) + '</b> · ' + (p.w ? 'победа' : 'поражение') + '<br>' + fmtDate(p.t) + ' · против ' + esc(p.opp);
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, x(i) - tw / 2)) + 'px';
    tip.style.top = Math.max(0, y(p.v) - tip.offsetHeight - 12) + 'px';
  };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { g.style.display = 'none'; tip.hidden = true; });
}

const exSt = () => Games.state(exCfg(), G.log);

// v — поля подхода без leg и p; ошибка показывается под счётом
function exSubmit(v, noSnap) {
  if (!G || G.kind !== 'ex' || G.over) return;
  const st = exSt();
  const ev = Object.assign({ leg: st.leg, p: v.tb ? v.p : st.cur }, v);
  if (!v.tb) delete ev.tb;
  const err = Games.check(exCfg(), G.log, ev);
  if (err) { G.note = err; G.visit = []; S.buf = ''; saveGame(); return render(); }
  if (!noSnap) snap();
  G.log.push(ev); G.visit = []; G.mult = 1; G.note = ''; S.buf = '';
  const st2 = exSt();
  if (st2.winner != null) { G.over = 'match'; G.winner = st2.winner; tapLock = Date.now() + 450; playSfx('win'); commitMatch(); }
  else if (st2.leg > st.leg) { G.over = 'leg'; G.winner = st2.legsLog[st2.legsLog.length - 1].w; tapLock = Date.now() + 450; playSfx('win'); }
  else playSfx(v.v === 180 ? '180' : 'dart');
  saveGame(); render();
}

    if (after.winner != null || after.leg > st.leg) return exVisitDone(true);

}

/* ===== Режим сервера: данные приходят из api.js, страница держит кэш с загрузкой и ошибками ===== */
let SRV = false;
const SVC = {};          // кэш запросов: ключ → { key, data, err, busy, at }
const SV = { live: {} }; // идущие матчи турниров из потока: tid → { id матча: LiveMatch }
// данные по ключу: свежие — сразу, устаревшие — перезапрашиваются фоном, первая загрузка — с надписью «Загрузка…»
function lz(key, fn, maxAge) {
  const e = SVC[key] || (SVC[key] = { key, data: null, err: null, busy: false, at: 0, errAt: 0 });
  e.fn = fn;
  const age = maxAge == null ? 25000 : maxAge;
  if (!e.busy && (!e.at || Date.now() - e.at > age) && !(e.err && Date.now() - e.errAt < 4000)) svRefresh(key);
  return e;
}
async function svRefresh(key) {
  const e = SVC[key];
  if (!e || e.busy || !e.fn) return;
  e.busy = true;
  try { e.data = await e.fn(e.data); e.err = null; e.at = Date.now(); }
  catch (x) { e.err = x; e.errAt = Date.now(); if (x.status === 401) svAuthLost(); }
  e.busy = false;
  render();
}
const svNow = key => { const e = SVC[key]; if (e) { e.at = 0; e.errAt = 0; svRefresh(key); } };
// пометить устаревшими все ключи с префиксом: перезапросятся при следующем показе
const svStale = prefix => Object.keys(SVC).forEach(k => { if (k.startsWith(prefix)) SVC[k].at = 0; });
// загрузка или ошибка с кнопкой «Повторить»; '' — данные есть
function svState(e, what) {

/* Поток турнира: живой счёт и обновление сетки без перезагрузки */
let STREAM = null;
let liveRaf = 0;
function svStream(tid) {
  if (STREAM && STREAM.tid === tid) return;
  if (STREAM) STREAM.s.close();
  STREAM = null;
  if (!tid) return;
  const s = Api.stream(tid, {
    snapshot: x => { SV.live[tid] = Object.fromEntries((x.matches || []).map(m => [m.id, m])); liveRender(); },
    match: m => {
      const L = SV.live[tid] || (SV.live[tid] = {});
      if (m.deleted || m.status === 'done') delete L[m.id];
      else if (!L[m.id] || L[m.id].version <= m.version) L[m.id] = m;
      if (m.status === 'done' || m.deleted) svNow('tour:' + tid);
      liveRender(m);
    },
    tour: x => { if (x.deleted) { toast('Турнир удалён.'); if (STREAM && STREAM.tid === tid) go('tours'); return; } svNow('tour:' + tid); },
    poll: () => svNow('tour:' + tid)
  });
  STREAM = { tid, s };
}
// много событий подряд — одна перерисовка на кадр; m — для анимаций табло

  if (m && typeof tvEvent === 'function') tvEvent(m);

  const t = TBY[q.tid], max = t ? exMax(t.qual.ex) : 0, v = +String(q.val).trim();
  if (String(q.val).trim() === '' || !Number.isInteger(v) || v < 0 || v > max) { q.err = 'Введите целое число от 0 до ' + max + '.'; return render(); }
  if (SRV) return svDo(Api.put('/api/tournaments/' + q.tid + '/qual/' + q.id + '/' + q.k, { v }), r => { svTourSet(r); S.qualModal = null; toast('Результат сохранён: ' + v + '.'); }).then(() => { if (S.qualModal) { S.qualModal.err = 'Не сохранилось — проверьте связь и повторите.'; render(); } });
  const old = qRes(t, q.id)[q.k];
  if (old && protoOk(old.mid)) { q.err = 'Эта попытка сыграна в счётчике — её результат не меняется вручную.'; return render(); }
  if (!setQual(q.tid, q.id, q.k, { v })) { q.err = 'Квалификация уже закрыта.'; return render(); }
  S.qualModal = null; saveDb(); toast('Результат сохранён: ' + v + '.'); render();
}

function addNtPlayer() {
  const el = $('nt-q'), nt = S.nt;
  if (!el || !nt) return;
  const name = el.value.trim().replace(/\s+/g, ' ');
  if (!name) { el.focus(); return; }
  const existed = ntExact(name);
  if (SRV) {
    // игрок без VK: создаёт организатор, повторное имя вернёт того же
    return svDo(Api.post('/api/players', { name, city: (nt.city || '').trim() || undefined }), r => {
      const p = svPlayer(r.player);
      if (!nt.sel.includes(p.id) && nt.sel.length < BR_MAX) nt.sel.push(p.id);
      nt.q = ''; nt.qq = ''; nt.err = '';
      svStale('psearch:');
      toast(existed ? p.name + ' добавлен в турнир.' : 'Новый игрок ' + p.name + ' добавлен в турнир.');
    }).then(() => { const ne = $('nt-q'); if (ne) ne.focus(); });
  }
  const p = addLocalPlayer(name, (nt.city || '').trim());
  if (!p) return;
  if (nt.sel.includes(p.id)) toast(p.name + ' уже в списке участников.');
  else if (nt.sel.length >= BR_MAX) toast('Максимум ' + BR_MAX + ' участника.');
  else { nt.sel.push(p.id); toast(existed ? p.name + ' добавлен в турнир.' : 'Новый игрок ' + p.name + ' добавлен в турнир.'); }
  nt.q = ''; nt.err = '';
  render();
  const ne = $('nt-q');
  if (ne) ne.focus();
}

// первый игрок дружеского матча — я (после входа имя меняется на своё)
function meInSetup() { const su = S.setup; if (su && ME && P[ME] && (!su.names[0] || su.names[0] === 'Вы')) { su.names[0] = P[ME].name; lsSet('oche2.setup', su); } }
async function boot() {
  applyTheme();
  app.innerHTML = '<div class="note-box">Загрузка…</div>';
  if (await Api.detect() === 'server') {
    SRV = true;
    ME = Api.me ? Api.me.id : null;
    if (Api.me) svPlayer(Api.me);
    db = { v: DB_V, players: [], tournaments: [], matches: [] };
    Api.ob.onchange = () => { if (!(R === 'play' && S.inGame)) $('top').innerHTML = topView(); else if (typeof obChanged === 'function') obChanged(); };
    Api.ob.clean(); Api.ob.kick();
    if (/[?&]login=fail/.test(location.search)) toast('Не удалось войти через VK. Попробуйте ещё раз.');
  } else loadDb();
  const su = lsGet('oche2.setup');
  S.setup = su && Array.isArray(su.names) && su.names.length ? su : defaultSetup();
  meInSetup();
  const g = lsGet('oche2.game');
  if (g && Array.isArray(g.players) && g.players.length && (g.mode || (g.kind === 'ex' && Games.norm(g.ex)))) {
    G = g;
    const u = lsGet('oche2.undo');
    undo = Array.isArray(u) ? u : [];
    // матч, который ведётся на сервере, проверяет сервер; демо-игра на сервере становится дружеской без отправки
    if (SRV) { if (!G.srv) G.ctx = null; }
    else if (G.srv) { G = null; undo = []; }
    else if (G.ctx && G.ctx.q) { if (!qualCtxOk(G.ctx)) G.ctx = null; }
    else if (G.ctx) {
      const x = readyGame(G.ctx.tid, G.ctx.r, G.ctx.i), ids = G.players.map(p => p.id);
      if (!x || !ids.includes(x.a) || !ids.includes(x.b)) G.ctx = null;
    }
  }
  const h = location.hash.slice(1);
  if (h && validRoute(h)) R = h;
  render();
}
boot();
</script>
