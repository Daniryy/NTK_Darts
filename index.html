* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
/* выделяется и копируется только нужное: поля ввода, ID, коды входа, контакты в карточке игрока, текст справки */
body { -webkit-user-select: none; user-select: none; }
input, textarea, [contenteditable], .sel, .code, .idchip b, .ac-grid, .hlp p, .tvqr .meta { -webkit-user-select: text; user-select: text; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 0 calc(90px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  min-height: 100dvh;
  overflow-x: hidden;
  transition: background-color .2s ease, color .2s ease;
}
@media (min-width: 768px) {
  body {
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
}
@media (min-width: 900px) {
  body {
    padding-block: 0 56px;
    padding-left: max(28px, env(safe-area-inset-left, 0px));
    padding-right: max(28px, env(safe-area-inset-right, 0px));
  }
}
button, input, [role="button"], [data-act] {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; transition: all .15s ease; user-select: none; }
button:focus-visible, input:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.meta { color: var(--muted); font-size: 13px; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 15px; height: 15px; stroke-width: 2.2; }

.top-wrap {
  position: sticky; top: 0; z-index: 10;
  margin-inline: calc(-1 * max(12px, env(safe-area-inset-left, 0px)));
  padding-inline: max(12px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  margin-bottom: 16px;
}
@media (min-width: 768px) {
  .top-wrap {
    margin-inline: calc(-1 * max(20px, env(safe-area-inset-left, 0px)));
    padding-inline: max(20px, env(safe-area-inset-left, 0px));
  }
}
@media (min-width: 900px) {
  .top-wrap {
    margin-inline: calc(-1 * max(28px, env(safe-area-inset-left, 0px)));
    padding-inline: max(28px, env(safe-area-inset-left, 0px));
    margin-bottom: 22px;
  }
}
.top { max-width: 1140px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
.brand svg { width: 29px; height: 29px; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { color: var(--fg); border-color: var(--line-bright); background: var(--surface2); }
.nav { display: none; gap: 4px; align-items: center; margin-left: auto; margin-right: 8px; }
.nav button { padding: 8px 14px; border-radius: 9px; color: var(--muted); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.nav button:hover { color: var(--fg); background: color-mix(in srgb, var(--surface2) 55%, transparent); }
.nav button.on { color: var(--fg); background: var(--surface2); box-shadow: inset 0 0 0 1px var(--line); }
.nav button.cta { background: var(--green); color: var(--green-ink); font-family: var(--display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 7px 16px; margin: 0 4px; box-shadow: 0 4px 14px var(--green-glow); }
.nav button.cta:hover { filter: brightness(1.08); transform: translateY(-1px); }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabs button { display: grid; justify-items: center; gap: 3px; padding: 5px 2px; font-size: 11px; color: var(--muted); border-radius: 8px; text-align: center; font-weight: 500; }
.tabs button.on { color: var(--fg); }
.tabs button.on .ic { color: var(--green); }
.tabs button.play .ic { width: 40px; height: 40px; padding: 8px; margin-top: -16px; border-radius: 50%; background: var(--green); color: var(--green-ink); box-shadow: 0 4px 12px var(--green-glow), 0 0 0 4px var(--surface); }
@media (min-width: 900px) { .nav { display: flex; } .tabs { display: none; } }

.wrap { max-width: 1140px; margin: 0 auto; display: grid; gap: 20px; }
.narrow { max-width: 680px; width: 100%; margin: 0 auto; display: grid; gap: 16px; }
.net { position: fixed; left: 0; right: 0; top: 0; z-index: 35; padding: calc(6px + env(safe-area-inset-top, 0px)) 12px 6px; background: var(--red); color: #fff; font-size: 13px; font-weight: 600; text-align: center; }
.net[hidden], body.ingame .net { display: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); pointer-events: none; background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 10px; z-index: 30; width: max-content; max-width: calc(100% - 32px); font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
@media (min-width: 900px) { .toast { bottom: 28px; } }
body.ingame .toast { bottom: auto; top: calc(8px + env(safe-area-inset-top, 0px)); }

.phead { display: flex; align-items: end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.phead-a { display: flex; gap: 8px; flex-wrap: wrap; }
.warn-a { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.warn-a .btn { width: auto; }
.h1 { font-family: var(--display); font-size: clamp(26px, 6vw, 42px); line-height: 1.04; text-transform: uppercase; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
.h2 { font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.sec { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; box-shadow: var(--shadow); }
@media (min-width: 640px) { .card { padding: 16px 18px; } }
.list { display: grid; gap: 10px; }
.fchips { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; align-items: center; padding-bottom: 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.fchips::-webkit-scrollbar { display: none; }
@media (min-width: 640px) { .fchips { flex-wrap: wrap; overflow-x: visible; } }
.fchip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; color: var(--muted); white-space: nowrap; flex: none; }
.fchip:hover { color: var(--fg); border-color: var(--line-bright); }
.fchip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pill.live { color: var(--green); font-weight: 600; }
.pill.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-glow); }
.lnk { color: var(--fg); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-bright); text-underline-offset: 3px; }
.lnk:hover { text-decoration-color: var(--green); color: var(--green); }
.pn { font-weight: 500; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pn:hover { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
.mini { padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); font-size: 12.5px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.mini:hover { color: var(--fg); border-color: var(--line-bright); }
.mini.go { background: var(--green); border-color: var(--green); color: var(--green-ink); font-weight: 600; }
.mini.go:hover { filter: brightness(1.08); }
.ghost { padding: 9px 14px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 13.5px; font-weight: 500; text-align: center; background: var(--surface); }
.ghost:hover { color: var(--fg); border-color: var(--line-bright); background: var(--surface2); }
.ghost.dng { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.ghost.dng:hover { background: var(--red-glow); }
.btn { width: 100%; padding: 14px 18px; border-radius: 11px; background: var(--green); color: var(--green-ink); font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; text-align: center; box-shadow: 0 4px 16px var(--green-glow); }
.btn:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); }
.btn.alt { background: var(--surface2); color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.btn.alt:hover:not(:disabled) { border-color: var(--line-bright); }
.btn.sm { width: auto; padding: 10px 18px; font-size: 16px; }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.note-box { padding: 13px 16px; border-radius: 12px; border: 1px dashed var(--line-bright); background: color-mix(in srgb, var(--surface) 65%, transparent); color: var(--muted); font-size: 13.5px; }
.note-box b { color: var(--fg); font-weight: 600; }
.av { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line-bright); color: var(--fg); font-family: var(--display); font-weight: 600; font-size: 14px; flex: none; }
.av.me { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.av.lg { width: 68px; height: 68px; font-size: 26px; }
.scroll { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scroll-snap-type: x proximity; }
.bk-col { scroll-snap-align: start; }
.more { justify-self: center; }

.fgrid { display: grid; gap: 22px; }
@media (min-width: 960px) { .fgrid { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.mc { display: grid; gap: 9px; transition: border-color .15s ease; }
.mc[role=button] { cursor: pointer; }
.mc[role=button]:hover { border-color: var(--line-bright); }
.mc-ctx { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--muted); }
.mc-ctx span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<script>
const BOARD = [];
for (let n = 1; n <= 20; n++) {
  BOARD.push({ l: String(n), v: n, d: false, base: n, m: 1 });
  BOARD.push({ l: 'D' + n, v: 2 * n, d: true, base: n, m: 2 });
  BOARD.push({ l: 'T' + n, v: 3 * n, d: false, base: n, m: 3 });
}
BOARD.push({ l: '25', v: 25, d: false, base: 25, m: 1 });
BOARD.push({ l: 'Bull', v: 50, d: true, base: 25, m: 2 });

const DOUBLE_PREF = ['D20','D16','D18','D12','D10','D8','D14','D6','D4','D2','D1','D19','D17','D15','D13','D11','D9','D7','D5','D3','Bull'];
const byLabel = l => BOARD.find(x => x.l === l);
const FINALS_DBL = DOUBLE_PREF.map(byLabel);
const FINALS_ANY = BOARD.slice().sort((a, b) => b.v - a.v);
const FIRST = BOARD.slice().sort((a, b) => (b.v - a.v) || (a.d - b.d));
const KIND_ORDER = x => (x.l[0] === 'T' ? 1 : x.d ? 2 : 0);
const IMPOSSIBLE = new Set([163, 166, 169, 172, 173, 175, 176, 178, 179]);
const cache = {};
// канонические закрытия на дубль 61–170 (проверено скриптом)
const CO3 = {170:'T20 T20 Bull',167:'T20 T19 Bull',164:'T20 T18 Bull',161:'T20 T17 Bull',160:'T20 T20 D20',158:'T20 T20 D19',157:'T20 T19 D20',156:'T20 T20 D18',155:'T20 T19 D19',154:'T20 T18 D20',153:'T20 T19 D18',152:'T20 T20 D16',151:'T20 T17 D20',150:'T20 T18 D18',149:'T20 T19 D16',148:'T20 T16 D20',147:'T20 T17 D18',146:'T20 T18 D16',145:'T20 T15 D20',144:'T20 T20 D12',143:'T20 T17 D16',142:'T20 T14 D20',141:'T20 T19 D12',140:'T20 T20 D10',139:'T20 T13 D20',138:'T20 T18 D12',137:'T20 T19 D10',136:'T20 T20 D8',135:'T20 T17 D12',134:'T20 T14 D16',133:'T20 T19 D8',132:'T20 T16 D12',131:'T20 T13 D16',130:'T20 T18 D8',129:'T19 T16 D12',128:'T18 T14 D16',127:'T20 T17 D8',126:'T19 T19 D6',125:'25 T20 D20',124:'T20 T16 D8',123:'T19 T16 D9',122:'T18 T18 D7',121:'T20 T11 D14',120:'T20 20 D20',119:'T19 T12 D13',118:'T20 18 D20',117:'T20 17 D20',116:'T20 16 D20',115:'T20 15 D20',114:'T20 14 D20',113:'T20 13 D20',112:'T20 12 D20',111:'T20 19 D16',110:'T20 Bull',109:'T20 9 D20',108:'T20 16 D16',107:'T19 Bull',106:'T20 10 D18',105:'T20 13 D16',104:'T18 Bull',103:'T19 6 D20',102:'T20 10 D16',101:'T17 Bull',100:'T20 D20',99:'T19 10 D16',98:'T20 D19',97:'T19 D20',96:'T20 D18',95:'T19 D19',94:'T18 D20',93:'T19 D18',92:'T20 D16',91:'T17 D20',90:'T20 D15',89:'T19 D16',88:'T20 D14',87:'T17 D18',86:'T18 D16',85:'T15 D20',84:'T20 D12',83:'T17 D16',82:'Bull D16',81:'T19 D12',80:'T20 D10',79:'T19 D11',78:'T18 D12',77:'T19 D10',76:'T20 D8',75:'T17 D12',74:'T14 D16',73:'T19 D8',72:'T16 D12',71:'T13 D16',70:'T18 D8',69:'T19 D6',68:'T20 D4',67:'T17 D8',66:'T10 D18',65:'T19 D4',64:'T16 D8',63:'T13 D12',62:'T10 D16',61:'T15 D8'};

function routeFor(rem, left, dbl) {
  if (rem < 1 || left < 1 || rem > (dbl ? 170 : 180)) return null;
  const key = rem + '|' + left + '|' + dbl;
  if (key in cache) return cache[key];
  const finals = dbl ? FINALS_DBL : FINALS_ANY;
  const min = dbl ? 2 : 1;
  let res = null;
  const one = r => finals.find(f => f.v === r) || null;
  // подводка без дублей и Bull, если такая есть
  const twoBy = (r, ok) => {
    for (const f of finals) {
      const a = r - f.v;
      if (a < 1) continue;
      const cands = BOARD.filter(x => x.v === a && ok(x)).sort((x, y) => KIND_ORDER(x) - KIND_ORDER(y));
      if (cands.length) return [cands[0], f];
    }
    return null;
  };
  const two = r => twoBy(r, x => !(dbl && x.d)) || twoBy(r, () => true);
  const co = dbl && (CO3[rem] || (rem === 50 && left > 1 && '10 D20'));
  if (co && co.split(' ').length <= left) res = co.split(' ').map(byLabel);
  const o = !res && one(rem);
  if (o) res = [o];
  if (!res && left >= 2) res = two(rem);
  if (!res && left >= 3) {
    for (const a of FIRST) {
      const r = rem - a.v;
      if (r < min) continue;
      const t = two(r);
      if (t) { res = [a, ...t]; break; }
    }
  }
  cache[key] = res;
  return res;
}
const routeText = r => r.map(x => x.l).join(' · ');

// озвучка счёта голосом браузера (русский голос, если есть); queue — не перебивать предыдущую фразу (табло)
function say(text, queue) {
  try {
    const sp = window.speechSynthesis;
    if (!sp || !text) return;
    if (!queue) sp.cancel();
    const u = new SpeechSynthesisUtterance(text), v = sp.getVoices().find(x => /^ru/i.test(x.lang));
    u.lang = 'ru-RU'; u.rate = 1.05; if (v) u.voice = v;
    sp.speak(u);
  } catch (e) {}
}
// подходы при пересчёте из журнала (отмена) не озвучиваются
let QUIET = false;

let audioCtx = null;
function playSfx(kind) {
  if (S.sfx && navigator.vibrate) {
    try {
      if (kind === 'dart') navigator.vibrate(12);
      else if (kind === '180' || kind === 'win') navigator.vibrate([25, 40, 45]);
      else if (kind === 'bust') navigator.vibrate([40, 30, 40]);
    } catch (e) {}
  }
  if (!S.sfx) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const TRANSLIT = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'sch', ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya' };

/* Стадии турнира: квалификация и круги сетки, у каждой процент завершения */
function stagesOf(t, rv) {

/* Квалификация: каждый сдаёт упражнение 1–2 раза, идёт лучший результат. По итогам — сетки по 8 мест. */

function drawChart() {
  const el = $('chart');
  if (!el || !CHART) return;
  const d = CHART, W = Math.max(260, el.clientWidth), H = Math.max(150, el.clientHeight);
  if (d.length < 2) { el.innerHTML = '<p class="meta">Нужно хотя бы два матча для графика.</p>'; return; }
  const padL = 32, padR = 42, padT = 14, padB = 26;
  const vs = d.map(x => x.v);
  let lo = Math.max(0, Math.floor((Math.min(...vs) - 3) / 10) * 10), hi = Math.ceil((Math.max(...vs) + 3) / 10) * 10;
  if (hi <= lo) hi = lo + 20;
  const step = hi - lo > 40 ? 20 : 10;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => padL + i * (W - padL - padR) / (d.length - 1);
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">';
  for (let v = lo; v <= hi; v += step) s += '<line class="ch-grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ch-tick" x="' + (padL - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
  const line = d.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  s += '<path class="ch-area" d="' + line + ' L' + x(d.length - 1).toFixed(1) + ' ' + y(lo) + ' L' + padL + ' ' + y(lo) + ' Z"/>';
  s += '<path class="ch-line" d="' + line + '"/>';
  s += '<text class="ch-tick" x="' + padL + '" y="' + (H - 6) + '">' + fmtDate(d[0].t) + '</text><text class="ch-tick" x="' + (W - padR) + '" y="' + (H - 6) + '" text-anchor="end">' + fmtDate(d[d.length - 1].t) + '</text>';
  const L = d.length - 1;
  s += '<circle class="ch-dot" cx="' + x(L) + '" cy="' + y(d[L].v) + '" r="4.5"/><text class="ch-end" x="' + (x(L) + 8) + '" y="' + (y(d[L].v) + 4) + '">' + d[L].v.toFixed(1) + '</text>';
  s += '<g id="ch-h" style="display:none"><line class="ch-x" id="ch-hl" y1="' + padT + '" y2="' + (H - padB) + '"/><circle class="ch-dot" id="ch-hd" r="5"/></g>';
  s += '<rect id="ch-hit" x="' + padL + '" y="0" width="' + (W - padL - padR) + '" height="' + H + '" fill="transparent"/></svg><div class="tip" id="ch-tip" hidden></div>';
  el.innerHTML = s;
  const hit = $('ch-hit'), g = $('ch-h'), tip = $('ch-tip');
  const show = e => {
    const r = el.getBoundingClientRect();
    const px = e.clientX - r.left;
    const i = Math.max(0, Math.min(L, Math.round((px - padL) / ((W - padL - padR) / L))));
    const p = d[i];
    g.style.display = '';
    $('ch-hl').setAttribute('x1', x(i)); $('ch-hl').setAttribute('x2', x(i));
    $('ch-hd').setAttribute('cx', x(i)); $('ch-hd').setAttribute('cy', y(p.v));
    tip.hidden = false;

    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, x(i) - tw / 2)) + 'px';
    tip.style.top = Math.max(0, y(p.v) - tip.offsetHeight - 12) + 'px';
  };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { g.style.display = 'none'; tip.hidden = true; });
}

// счётчик из матча сервера и его событий
function restoreGame(m, events) {

  newGame(m.players.map(p => ({ id: p.id, name: p.name })), { legsToWin: m.ltw, ex }, ctx, m.starter);

// x01: прогнать подходы через счётчик, чтобы восстановить статистику
function replayX01(vis) {
  for (const v of vis) {
    if (G.over === 'leg') { G.players.forEach(p => { p.score = G.mode; p.last = ''; p.legDarts = 0; p.legVisits = 0; }); G.starter = (G.starter + 1) % G.players.length; G.cur = G.starter; G.over = null; G.winner = null; G.legNo++; G.prev = null; G.tb = null; }
    if (G.over) break;
    if (v.tb) { G.log.push({ p: v.p, leg: G.legNo, tb: 1 }); G.tb = null; G.cur = v.p; legWonQuiet(); continue; }
    G.cur = v.p;
    const win = !v.b && G.players[v.p].score - v.pts === 0;

    G.entry = v.d && v.d.length ? 'darts' : 'total';

// рамка на экране и положение картинки в ней: картинка всегда закрывает рамку целиком
function cropGeom(fw, fh) {
  const c = S.crop, W = cropImg.naturalWidth, H = cropImg.naturalHeight, s = Math.max(fw / W, fh / H) * c.zoom;
  const w = W * s, h = H * s;

}
function cropDraw() {

  const cv = box.querySelector('canvas'), fw = box.clientWidth, fh = box.clientHeight, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(fw * dpr); cv.height = Math.round(fh * dpr);
  const g = cropGeom(fw, fh), x = cv.getContext('2d');

  x.drawImage(cropImg, S.crop.ox, S.crop.oy, g.w, g.h);

    box.addEventListener('pointermove', e => { if (!drag || !S.crop) return; S.crop.ox = drag.ox + e.clientX - drag.x; S.crop.oy = drag.oy + e.clientY - drag.y; cropDraw(); });

// приближение относительно центра рамки
function cropZoom(z) {

  const fw = box.clientWidth, fh = box.clientHeight, before = cropGeom(fw, fh), c = S.crop;
  const cx = (fw / 2 - c.ox) / before.w, cy = (fh / 2 - c.oy) / before.h;
  c.zoom = Math.max(1, Math.min(5, z));
  const after = cropGeom(fw, fh);
  c.ox = fw / 2 - cx * after.w; c.oy = fh / 2 - cy * after.h;

}

// ссылка на трансляцию или код вставки → адрес плеера; null — встроить нельзя, будет просто ссылка
function streamSrc(raw) {
  let s = String(raw || '').trim();
  const fr = s.match(/<iframe[^>]+src=["']([^"']+)["']/i);
  if (fr) s = fr[1].replace(/&amp;/g, '&');
  if (s.startsWith('//')) s = 'https:' + s;
  let u;
  try { u = new URL(s); } catch (e) { return null; }
  if (u.protocol !== 'https:') return null;
  const host = u.hostname.replace(/^(www|m)\./, '');
  if (/^(vk\.com|vk\.ru|vkvideo\.ru)$/.test(host)) {
    let oid = u.searchParams.get('oid'), id = u.searchParams.get('id');
    const hash = u.searchParams.get('hash');
    if (u.pathname !== '/video_ext.php') {
      const v = (u.pathname + ' ' + (u.searchParams.get('z') || '')).match(/video(-?\d+)_(\d+)/);
      oid = v && v[1]; id = v && v[2];
    }
    if (!/^-?\d+$/.test(oid || '') || !/^\d+$/.test(id || '')) return null;
    return 'https://' + (host === 'vk.ru' ? 'vk.com' : host) + '/video_ext.php?oid=' + oid + '&id=' + id + (hash && /^\w+$/.test(hash) ? '&hash=' + hash : '') + '&hd=2&autoplay=1';
  }
  if (/^(youtube\.com|youtu\.be|youtube-nocookie\.com)$/.test(host)) {
    const id = host === 'youtu.be' ? u.pathname.slice(1) : u.searchParams.get('v') || (u.pathname.match(/^\/(?:live|embed|shorts)\/([\w-]+)/) || [])[1];
    return /^[\w-]{6,20}$/.test(id || '') ? 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&mute=1&playsinline=1' : null;
  }
  if (host === 'rutube.ru') {
    const id = (u.pathname.match(/\/(?:video|live\/video|play\/embed)\/([0-9a-f]{20,40})/) || [])[1];
    return id ? 'https://rutube.ru/play/embed/' + id : null;
  }
  return null;
}

function camsSave(tid) {

  for (const [k, c] of ed.entries()) {

    if (!url) continue;
    const fr = url.match(/<iframe[^>]+src=["']([^"']+)["']/i);
    if (fr) url = fr[1].replace(/&amp;/g, '&');
    if (url.startsWith('//')) url = 'https:' + url;
    if (!/^https:\/\//.test(url)) { toast('Камера ' + (k + 1) + ': нужна ссылка, которая начинается с https://'); return; }

}

/* Задержка счёта под видео (табло): снимки идущих матчей с временем прихода, показываем снимок «как N секунд назад» */
const LIVEH = {};
function liveHist(tid, m, del) {
  const H = LIVEH[tid] || (LIVEH[tid] = {}), a = H[m.id] || (H[m.id] = []), now = Date.now();
  a.push({ at: now, m: del ? null : JSON.parse(JSON.stringify(m)) });
  while (a.length > 1 && a[1].at < now - 60000) a.shift();
}
function liveDelayed(t, sec) {
  const H = LIVEH[t.id] || {}, cut = Date.now() - sec * 1000, out = [];
  let next = 0;
  Object.keys(H).forEach(id => {
    const a = H[id];
    let pick = null;
    for (const x of a) { if (x.at <= cut) pick = x; else { next = next ? Math.min(next, x.at) : x.at; break; } }
    if (pick && pick.m) out.push(pick.m);
  });
  // следующий снимок созреет — перерисовать
  if (next) { clearTimeout(liveDelayed.t); liveDelayed.t = setTimeout(() => { if (/^(tv|desk)\./.test(R)) render(); }, Math.max(50, next - cut + 20)); }
  return out;
}

function mailAct(a) {

const ACH = [
  ['win', 'Первая победа', x => x.w >= 1], ['m10', '10 матчей', x => x.n >= 10], ['m100', '100 матчей', x => x.n >= 100],
  ['180', 'Первые 180', x => x.c180 >= 1], ['180x10', '180 × 10', x => x.c180 >= 10], ['ton', 'Закрытие 100+', x => x.hco >= 100], ['170', 'Big Fish — 170', x => x.hco === 170],
  ['l15', 'Лег за 15 дротиков', x => x.bl > 0 && x.bl <= 15], ['l12', 'Лег за 12 дротиков', x => x.bl > 0 && x.bl <= 12], ['l9', 'Девятидротиковый лег', x => x.bl === 9],
  ['a60', 'Среднее 60+ за матч', x => x.best >= 60], ['a80', 'Среднее 80+ за матч', x => x.best >= 80], ['a100', 'Среднее 100+ за матч', x => x.best >= 100],
  ['champ', 'Победа в турнире', x => x.wins >= 1]
];
function achHTML(x) {

  return '<div class="card sec"><div class="tstat"><span class="label">Достижения · ' + got + ' из ' + ACH.length + '</span></div><div class="achs">' + ACH.map(a => { const ok = a[2](x); return '<span class="ach' + (ok ? ' on' : '') + '" title="' + (ok ? 'Получено' : 'Ещё не получено') + '">' + (ok ? '★ ' : '') + esc(a[1]) + '</span>'; }).join('') + '</div></div>';
}
// для демо: лучшее среднее и победы в турнирах из локальных данных
function achDemo(id) {
  let best = 0;
  pStats(id, false).ms.forEach(m => { const l = m.pl.find(y => y.id === id); if (l && isPlainX01(m) && l.darts >= 9) best = Math.max(best, l.pts / l.darts * 3); });
  const wins = db.tournaments.filter(t => t.players.includes(id) && tStatus(t) === 'done' && (t.format === 'rr' ? standings(t)[0].id === id : (placeRange(t, id) || [])[0] === 1 && (placeRange(t, id) || [])[1] === 1)).length;
  return { best, wins };
}

let STREAM = null;

function svStream(tid) {
  if (STREAM && STREAM.tid === tid) return;

  if (!tid) return;
  const s = Api.stream(tid, {
    snapshot: x => {
      const prev = SV.live[tid] || {};
      SV.live[tid] = Object.fromEntries((x.matches || []).map(m => [m.id, m]));
      Object.keys(prev).forEach(id => { if (!SV.live[tid][id]) liveHist(tid, { id }, true); });
      (x.matches || []).forEach(m => liveHist(tid, m));
      liveRender();
    },
    match: m => {
      const L = SV.live[tid] || (SV.live[tid] = {});
      if (m.deleted || m.status === 'done') { delete L[m.id]; liveHist(tid, m, true); }
      else if (!L[m.id] || L[m.id].version <= m.version) { L[m.id] = m; liveHist(tid, m); }
      if (m.status === 'done' || m.deleted) svNow('tour:' + tid);

    tour: x => { if (x.deleted) { toast('Турнир удалён.'); if (STREAM && STREAM.tid === tid) go('tours'); return; } svNow('tour:' + tid); },
    poll: () => svNow('tour:' + tid)

// экран не гаснет во время игры
function wakeOn() {
  if (wake || !navigator.wakeLock || document.visibilityState !== 'visible') return;
  wake = 'pending';
  try {
    navigator.wakeLock.request('screen').then(l => {
      l.addEventListener('release', () => { if (wake === l) wake = null; });
      if (wake === 'pending' && document.body.classList.contains('ingame')) wake = l;
      else { l.release().catch(() => {}); if (wake === 'pending') wake = null; }
    }).catch(() => { if (wake === 'pending') wake = null; });
  } catch (e) { wake = null; }
}
function wakeOff() {
  if (wake && wake !== 'pending') wake.release().catch(() => {});
  wake = null;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && document.body.classList.contains('ingame')) wakeOn(); });

    document.querySelectorAll('.pick[data-key]').forEach(b => { b.hidden = !!q && !b.dataset.key.includes(q); });
    if (add) { add.hidden = !raw || ntExact(raw); add.textContent = '+ Добавить «' + raw + '»'; }
  }

  if (t.dataset && t.dataset.num && !SRV) {
    const [tid, id] = t.dataset.num.split('|'), n = +t.value;
    if (Number.isInteger(n) && n >= 1 && n <= 999) setNum(tid, id, n);
  }
  if (t.dataset && t.dataset.hp !== undefined && t.tagName === 'SELECT') { S.hp = t.value || null; render(); }
  if (t.id === 'crop-z') cropZoom(+t.value);
  if (t.dataset && t.dataset.camF && S.camEdit) { const [k, f] = t.dataset.camF.split('|'), c = S.camEdit.list[+k]; if (c) c[f] = t.value; }
  if (t.id === 'q-val' && S.qualModal) { S.qualModal.val = t.value; S.qualModal.err = ''; }
  if (t.dataset && t.dataset.lf && S.login) { S.login[t.dataset.lf] = t.value; return; }
  if (t.dataset && t.dataset.bnr && S.bnr) { S.bnr[t.dataset.bnr] = t.value; return; }
  if (t.id === 'num-n') { S.numN = t.value; return; }
  if (t.id === 'st-login') { S.staffLogin = t.value; return; }
  if (t.dataset && t.dataset.tf && S.tForm) { S.tForm[t.dataset.tf] = t.value; return; }
  if (t.dataset && t.dataset.numq) { S.numQ = t.value; clearTimeout(S.numT); S.numT = setTimeout(() => { S.numQQ = S.numQ; render(); const el = $('num-q'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 300); return; }
  if (t.dataset && t.dataset.admq) { S.admQ = t.value; clearTimeout(S.admT); S.admT = setTimeout(render, 300); return; }
  if (t.dataset && t.dataset.rsearch && SRV) {
    S.rsearch = t.value;
    clearTimeout(S.rqT); S.rqT = setTimeout(() => { S.rq = S.rsearch; S.rpage = 0; render(); }, 300);
    return;
  }
  if (t.dataset && t.dataset.rsearch) {
    S.rsearch = t.value; S.rpage = 0;
    const pos = t.selectionStart;
    render();
    const el = $('r-search');
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.rregion) { S.rregion = t.value; S.rpage = 0; render(); return; }
  if (t.dataset && t.dataset.roleOf) {
    const role = t.value;
    svDo(Api.patch('/api/admin/players/' + t.dataset.roleOf, { role }), () => { svStale('admin:'); svStale('acard:'); svStale('astats'); toast('Роль: ' + roleName(role) + '.'); });
    return;
  }
  if (t.id === 'bnr-file') { bannerUpload(t.files && t.files[0]); return; }
  if (t.dataset && t.dataset.dsel) {
    const [pre] = t.dataset.dsel.split('|'), box = t.closest('.dsel'), g = k => (box.querySelector('[data-dsel="' + pre + '|' + k + '"]') || {}).value || '';
    const y = g('y'), m = g('m'), d = g('d');
    if (pre === 'tf' && S.tForm) S.tForm.orderDate = y && m && d ? y + '-' + String(m).padStart(2, '0') + '-' + String(Math.min(+d, new Date(+y, +m, 0).getDate())).padStart(2, '0') : '';
    return;
  }
  if (t.dataset && t.dataset.cbnImg) { clubBannerImg(t.dataset.cbnImg, t.files && t.files[0]); return; }
  if (t.id === 'tf-file') { titleUpload([...(t.files || [])]); t.value = ''; return; }
  if (t.dataset && t.dataset.perm && S.permEd) {
    const [k, r] = t.dataset.perm.split('|'), cur = S.permEd[k] || [];
    S.permEd[k] = t.checked ? cur.concat(cur.includes(r) ? [] : [r]) : cur.filter(x => x !== r);
    render(); return;
  }
  if (SRV && t.dataset && t.dataset.num) {
    const [tid, id] = t.dataset.num.split('|'), n = +t.value;
    if (Number.isInteger(n) && n >= 1 && n <= 999) setNum(tid, id, n);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && anyModal()) { closeModals(); render(); return; }
  const t = e.target;
  const inInput = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
  if (e.key === 'Enter' && t && t.id === 'nt-q') {
    e.preventDefault();
    const vis = [...document.querySelectorAll('.pick[data-key]:not([hidden])')];
    if (t.value.trim() && vis.length === 1) { vis[0].click(); const ne = $('nt-q'); if (ne) ne.focus(); }
    else if (t.value.trim() && !vis.length) addNtPlayer();
    return;
  }
  if (e.key === 'Enter' && t && t.id === 'q-val') { e.preventDefault(); saveQualEntry(); return; }
  if (e.key === 'Enter' && t && /^mail-/.test(t.id) && S.login) { e.preventDefault(); const b = document.querySelector('.ocard.login .btn:not(.alt)'); if (b && !b.disabled) b.click(); return; }
  if (e.key === 'Enter' && t && /^login-(phone|otp|code)$/.test(t.id)) { e.preventDefault(); loginAct(t.id === 'login-phone' ? 'send' : t.id === 'login-otp' ? 'verify' : 'code'); return; }
  if (e.key === 'Enter' && t && t.id === 'nt-nums') { e.preventDefault(); const b = $('app').querySelector('[data-act="nt-nums"]'); if (b) b.click(); return; }
  if (e.key === 'Enter' && t && (t.id === 'st-login' || t.id === 'st-pass')) { e.preventDefault(); if (t.id === 'st-login') { const n = $('st-pass'); if (n) n.focus(); } else { const b = $('app').querySelector('[data-act="staff-login"]'); if (b) b.click(); } return; }
  if (e.key === 'Enter' && t && t.id === 'dev-id') { e.preventDefault(); const b = document.querySelector('[data-act="dev-login"]'); if (b) b.click(); return; }
  if (e.key === 'Enter' && t && /^me-/.test(t.id)) { const sb = $('app').querySelector('[data-act="savename"]'); if (sb) sb.click(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button') { e.preventDefault(); t.click(); return; }

  if (!inInput && !anyModal() && !e.ctrlKey && !e.metaKey && !e.altKey && R === 'play' && S.inGame && G) {
    if (G.over === 'leg' && e.key === 'Enter') { e.preventDefault(); if (Date.now() >= tapLock) nextLeg(); return; }
    if (G.over) return;
    if (G.ask != null) { if (/^[123]$/.test(e.key)) finishAsk(+e.key); return; }
    if (G.kind === 'ex' && G.ex.k !== 'score') {
      if (G.entry === 'total' && /^[0-9]$/.test(e.key)) exSubmit({ v: +e.key });
      else if (e.key === 'Backspace') { e.preventDefault(); if (!e.repeat) doUndo(); }
      return;
    }
    if (G.entry === 'total') {
      if (/^[0-9]$/.test(e.key)) tDig(e.key);
      else if (e.key === 'Enter') { e.preventDefault(); if (S.buf) submitTotal(+S.buf); }
      else if (e.key === 'Backspace') {
        e.preventDefault();
        // зажатый Backspace стирает цифры, но не отменяет бросок
        if (S.buf) tErase();
        else if (!e.repeat && Date.now() - eraseT > 700) doUndo();
      }
    } else if (e.key === '0') throwDart(0, 1);
    else if (e.key === 'Backspace') { e.preventDefault(); if (!e.repeat) doUndo(); }
  }
});

function hoverPath(id, on) {
  document.querySelectorAll('[data-pids~="' + id + '"]').forEach(el => el.classList.toggle('path', on || el.dataset.pids.split(' ').includes(S.hp || '')));
  document.querySelectorAll('[data-pid="' + id + '"]').forEach(el => el.classList.toggle('hp', on));
}
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('[data-pid]'); if (el && el.closest('.pg, .bk, .glist')) hoverPath(el.dataset.pid, true); });
document.addEventListener('mouseout', e => { const el = e.target.closest && e.target.closest('[data-pid]'); if (el && !el.contains(e.relatedTarget)) hoverPath(el.dataset.pid, false); });

function saveQualEntry() {
  const q = S.qualModal;
  if (!q) return;
  const t = TBY[q.tid], max = t ? exMax(t.qual.ex) : 0, v = +String(q.val).trim();
  if (String(q.val).trim() === '' || !Number.isInteger(v) || v < 0 || v > max) { q.err = 'Введите целое число от 0 до ' + max + '.'; return render(); }
  if (SRV) return svDo(Api.put('/api/tournaments/' + q.tid + '/qual/' + q.id + '/' + q.k, { v }), r => { svTourSet(r); S.qualModal = null; toast('Результат сохранён: ' + v + '.'); }).then(() => { if (S.qualModal) { S.qualModal.err = 'Не сохранилось — проверьте связь и повторите.'; render(); } });
  const old = qRes(t, q.id)[q.k];
  if (old && protoOk(old.mid)) { q.err = 'Эта попытка сыграна в счётчике — её результат не меняется вручную.'; return render(); }
  if (!setQual(q.tid, q.id, q.k, { v })) { q.err = 'Квалификация уже закрыта.'; return render(); }
  S.qualModal = null; saveDb(); toast('Результат сохранён: ' + v + '.'); render();
}

function addNtPlayer() {
  const el = $('nt-q'), nt = S.nt;
  if (!el || !nt) return;
  const name = el.value.trim().replace(/\s+/g, ' ');
  if (!name) { el.focus(); return; }
  const existed = ntExact(name);
  if (SRV) {
    // игрок без VK: создаёт организатор, повторное имя вернёт того же
    return svDo(Api.post('/api/players', { name, city: (nt.city || '').trim() || undefined }), r => {
      const p = svPlayer(r.player);
      if (!nt.sel.includes(p.id) && nt.sel.length < BR_MAX) nt.sel.push(p.id);
      nt.q = ''; nt.qq = ''; nt.err = '';
      svStale('psearch:');
      toast(existed ? p.name + ' добавлен в турнир.' : 'Новый игрок ' + p.name + ' добавлен в турнир.');
    }).then(() => { const ne = $('nt-q'); if (ne) ne.focus(); });
  }
  const p = addLocalPlayer(name, (nt.city || '').trim());
  if (!p) return;
  if (nt.sel.includes(p.id)) toast(p.name + ' уже в списке участников.');
  else if (nt.sel.length >= BR_MAX) toast('Максимум ' + BR_MAX + ' участника.');
  else { nt.sel.push(p.id); toast(existed ? p.name + ' добавлен в турнир.' : 'Новый игрок ' + p.name + ' добавлен в турнир.'); }
  nt.q = ''; nt.err = '';
  render();
  const ne = $('nt-q');
  if (ne) ne.focus();
}

/* Без сети и установка на экран телефона */
function netBar() { const el = $('net'); if (el) el.hidden = navigator.onLine !== false; }
window.addEventListener('online', () => { netBar(); if (SRV) { Object.keys(SVC).forEach(k => { if (SVC[k].err) svNow(k); }); render(); } });
window.addEventListener('offline', netBar);
let installEv = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; });
window.addEventListener('appinstalled', () => { installEv = null; toast('Oche на экране телефона.'); });
/* ===== Как пользоваться: коротко для игроков и ведущих ===== */
const HELP = [

    ['Как попасть в турнир', 'Откройте «Турниры» → «Регистрация», выберите турнир и нажмите «Записаться». На месте ведущий может показать QR-код — наведите камеру, и турнир откроется сразу. Пока турнир идёт, вкладка «Турниры» и запуск Oche возвращают прямо в него, а на «Играть» видно ваш матч и ход турнира.'],
    ['Когда мой матч', 'Как только ваш матч можно играть, в ленте и в турнире появится яркая плашка «Ваш матч»: соперник и мишень, телефон коротко завибрирует. Кнопка «Играть» открывает счётчик уже с этим матчем.'],
    ['Как вести счёт', '«Сумма» — набираете очки за подход и жмёте ввод, это быстрее всего. «По дротикам» — каждый дротик отдельно (Дубль/Трипл перед числом), тогда считаются попытки на дубль. Ошиблись — «Отмена» снимает последний бросок, можно отменять подряд.'],
    ['Подсказки закрытия и озвучка', 'Когда остаётся 170 и меньше, счётчик показывает, как закрыть. В настройках (шестерёнка) можно включить «Озвучка счёта»: телефон проговорит набор, перебор и сколько осталось — не нужно смотреть на экран.'],
    ['Пропала сеть', 'Ничего не теряется: подходы сохраняются на телефоне (вверху видно «не отправлено: N») и уйдут на сервер, когда сеть появится. Если счёт начали на другом телефоне — «Забрать ведение счёта».'],
    ['Рейтинг и рекорды', 'Рейтинг Эло считается по турнирным матчам: старт 1500, за матч до ±32. После матча счётчик поздравит с личным рекордом: лучший средний набор, закрытие, лег, подход.'],
    ['Как приложение на телефоне', 'Настройки → «Установить на экран телефона» (на iPhone: «Поделиться» → «На экран Домой»). Открывается без адресной строки, экран не гаснет во время игры.']
  ]],
  ['Ведущему', [
    ['Создать турнир', '«Турниры» → «+ Создать турнир»: название, дата, формат и число легов. Форматы: «Круговая» — все со всеми; «На вылет» — проиграл и выбыл; «Все места» — проигравшие продолжают и разыгрывают каждое место; квалификация + сетки — как в лиге NDL. Взнос — по желанию, с суммой.'],
    ['Начать и вести', 'Когда все записались — «Начать турнир». На вкладке «Матчи» фильтр «Можно играть» показывает, кого звать к мишеням; число мишеней задаётся кнопками +/−, матчи раскладываются по ним сами. Счёт вводят сами игроки со своих телефонов или вы — кнопкой «Счёт».'],
    ['Табло и экран организатора', '«Табло для ТВ» — на телевизор в зале: идущие матчи, вспышки 180 и закрытий, вызовы к мишеням, по желанию QR и озвучка. «Экран организатора» — всё управление на одном экране, «Слежка за матчами» — все матчи сразу.'],
    ['Взносы', 'Если у турнира есть взнос, на вкладке «Взносы» отмечайте, кто оплатил — видно только вам и помощникам.'],
    ['Итоги для соцсетей', 'После турнира в карточке итогов: «Картинка итогов» (готовая под пост), «Текст для поста» и «Документ Word». Там же можно прикрепить общее фото всех игроков — оно появится в ленте вместе с итогами.'],
    ['Камеры и фото', 'На вкладке «Трансляция» добавьте ссылки на камеры VK — они покажутся на странице турнира и на табло; если видео отстаёт, задержите счёт на табло. Фото и ссылки на посты — во вкладке «Фото и ссылки».']
  ]]
];
// подсказка в ленте для новичка: скрывается крестиком навсегда (на этом устройстве)
const helpHint = () => lsGet('oche2.hlp') ? '' : '<div class="card hint"><div><b>Впервые здесь?</b><div class="meta">Как записаться, вести счёт и провести турнир — за пару минут.</div></div><div class="row"><button class="mini go" data-act="go" data-v="help">Как пользоваться</button><button class="icon-btn" data-act="hlp-hide" aria-label="Скрыть подсказку">✕</button></div></div>';
function helpView() {
  let h = '<div class="narrow"><div class="phead"><h1 class="h1">Как пользоваться</h1></div>';
  HELP.forEach(([sec, items]) => {
    h += '<div class="sec"><span class="label">' + sec + '</span><div class="card hlp">' + items.map(([q, a]) => '<details><summary>' + esc(q) + '</summary><p>' + esc(a) + '</p></details>').join('') + '</div></div>';
  });
  return h + '<p class="meta">Остались вопросы — напишите организатору своего клуба.</p></div>';
}
function installBox() {
  if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return '';
  if (installEv) return '<button class="btn alt" data-act="install">Установить на экран телефона</button>';
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) return '<p class="meta">На экран iPhone: «Поделиться» → «На экран Домой».</p>';
  return '<p class="meta">На экран телефона: меню браузера → «Добавить на главный экран».</p>';
}
// первый игрок дружеского матча — я (после входа имя меняется на своё)
function meInSetup() { const su = S.setup; if (su && ME && P[ME] && (!su.names[0] || su.names[0] === 'Вы')) { su.names[0] = P[ME].name; lsSet('oche2.setup', su); } }
async function boot() {
  applyTheme();
  netBar();
  // страница открывается и без сети (sw.js); на http без localhost браузер не даст его поставить
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  app.innerHTML = '<div class="note-box">Загрузка…</div>';
  if (await Api.detect() === 'server') {
    SRV = true;
    ME = Api.me ? Api.me.id : null;
    if (Api.me) svPlayer(Api.me);
    db = { v: DB_V, players: [], tournaments: [], matches: [] };
    Api.ob.onchange = () => { if (!(R === 'play' && S.inGame)) $('top').innerHTML = topView(); else if (typeof obChanged === 'function') obChanged(); };
    Api.ob.clean(); Api.ob.kick();
    const lg = (location.search.match(/[?&]login=(\w+)/) || [])[1];
    if (lg) toast({ fail: 'Не удалось войти через VK. Попробуйте ещё раз.', vk_taken: 'Этот VK уже привязан к другому аккаунту.', linked: 'VK привязан к аккаунту.', blocked: 'Аккаунт заблокирован администратором.' }[lg] || 'Вход не выполнен.');
  } else loadDb();
  const su = lsGet('oche2.setup');
  S.setup = su && Array.isArray(su.names) && su.names.length ? su : defaultSetup();
  meInSetup();
  const g = lsGet('oche2.game');
  if (g && Array.isArray(g.players) && g.players.length && (g.mode || (g.kind === 'ex' && Games.norm(g.ex)))) {
    G = g;
    const u = lsGet('oche2.undo');
    undo = Array.isArray(u) ? u : [];
    // матч, который ведётся на сервере, проверяет сервер; демо-игра на сервере становится дружеской без отправки
    if (SRV) { if (!G.srv) G.ctx = null; }
    else if (G.srv) { G = null; undo = []; }
    else if (G.ctx && G.ctx.q) { if (!qualCtxOk(G.ctx)) G.ctx = null; }
    else if (G.ctx) {
      const x = readyGame(G.ctx.tid, G.ctx.r, G.ctx.i), ids = G.players.map(p => p.id);
      if (!x || !ids.includes(x.a) || !ids.includes(x.b)) G.ctx = null;
    }
  }
  const h = location.hash.slice(1);
  if (h && validRoute(h)) { R = h; if (h.startsWith('t.')) ROOM_LINK = h.slice(2); }
  // без адреса — в свой турнир, если он ещё идёт
  else if (!h && roomId() && validRoute('t.' + roomId())) R = 't.' + roomId();
  render();
}
boot();
