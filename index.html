<style>
:root { --top-h: 59px; }
@media (pointer: coarse) { :root { --top-h: 65px; } }
:root,
:root[data-palette="amber"] {
  --bg: #0e1015;
  --bg-grad: radial-gradient(1200px 600px at 50% -10%, rgba(245, 158, 11, 0.15), rgba(59, 130, 246, 0.05) 55%, transparent 75%);
  --surface: #161922;
  --surface2: #1e2330;
  --surface3: #282f40;

  --fg: #f4f1ea;
  --muted: #949db0;
  --green: #f59e0b;
  --green-glow: rgba(245, 158, 11, 0.24);
  --green-ink: #170f02;
  --red: #f43f5e;
  --red-glow: rgba(244, 63, 94, 0.2);
  --brass: #38bdf8;

  --surface2: #19233c;
  --surface3: #223052;
  --line: #243252;
  --line-bright: #384e7c;
  --fg: #f0f6ff;
  --muted: #8da0c2;
  --green: #38bdf8;
  --green-glow: rgba(56, 189, 248, 0.25);
  --green-ink: #04131f;
  --red: #fb7185;
  --red-glow: rgba(251, 113, 133, 0.2);

  --brass-glow: rgba(251, 191, 36, 0.2);

:root[data-palette="emerald"] {

  --bg-grad: radial-gradient(1200px 600px at 50% -10%, rgba(58, 164, 106, 0.14), transparent 70%);
  --surface: #151e18;
  --surface2: #1d2920;
  --surface3: #26352a;
  --line: #2a392e;
  --line-bright: #3d5443;
  --fg: #f0ead8;
  --muted: #93a392;
  --green: #38b26f;
  --green-glow: rgba(56, 178, 111, 0.24);

  --red: #e5563d;

:root[data-theme="light"] {

  --line: #d4dce8;

  --muted: #525d71;

  --green: #b45309;
  --green-glow: rgba(180, 83, 9, 0.18);
  --green-ink: #ffffff;
  --brass: #0369a1;
  --brass-glow: rgba(3, 105, 161, 0.14);
  --brass-ink: #ffffff;
}
:root[data-theme="light"][data-palette="sapphire"] {
  --green: #0369a1;
  --green-glow: rgba(3, 105, 161, 0.18);
  --green-ink: #ffffff;
  --brass: #b45309;
  --brass-glow: rgba(180, 83, 9, 0.14);
  --brass-ink: #ffffff;
}
:root[data-theme="light"][data-palette="emerald"] {
  --bg: #e8ede3;
  --surface: #f7f9f3;
  --surface2: #e4eadf;
  --surface3: #d6dfd0;
  --line: #c5d0bf;
  --line-bright: #a6b79e;
  --fg: #151f18;
  --muted: #4d5d50;
  --green: #1b7444;
  --green-glow: rgba(27, 116, 68, 0.18);
  --green-ink: #f4fbf6;
  --brass: #8c6a10;
  --brass-glow: rgba(140, 106, 16, 0.16);

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 0 calc(90px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  min-height: 100dvh;
  overflow-x: hidden;
  transition: background-color .2s ease, color .2s ease;
}
@media (min-width: 768px) {
  body {
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
}
@media (min-width: 900px) {
  body {
    padding-block: 0 56px;
    padding-left: max(28px, env(safe-area-inset-left, 0px));
    padding-right: max(28px, env(safe-area-inset-right, 0px));
  }
}
button, input, [role="button"], [data-act] {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; transition: all .15s ease; user-select: none; }
button:focus-visible, input:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.meta { color: var(--muted); font-size: 13px; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 15px; height: 15px; stroke-width: 2.2; }

.top-wrap {
  position: sticky; top: 0; z-index: 10;
  margin-inline: calc(-1 * max(12px, env(safe-area-inset-left, 0px)));
  padding-inline: max(12px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  margin-bottom: 16px;
}
@media (min-width: 768px) {
  .top-wrap {
    margin-inline: calc(-1 * max(20px, env(safe-area-inset-left, 0px)));
    padding-inline: max(20px, env(safe-area-inset-left, 0px));
  }
}
@media (min-width: 900px) {
  .top-wrap {
    margin-inline: calc(-1 * max(28px, env(safe-area-inset-left, 0px)));
    padding-inline: max(28px, env(safe-area-inset-left, 0px));
    margin-bottom: 22px;
  }
}
.top { max-width: 1140px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
.brand svg { width: 29px; height: 29px; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { color: var(--fg); border-color: var(--line-bright); background: var(--surface2); }
.nav { display: none; gap: 4px; align-items: center; margin-left: auto; margin-right: 8px; }
.nav button { padding: 8px 14px; border-radius: 9px; color: var(--muted); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.nav button:hover { color: var(--fg); background: color-mix(in srgb, var(--surface2) 55%, transparent); }
.nav button.on { color: var(--fg); background: var(--surface2); box-shadow: inset 0 0 0 1px var(--line); }
.nav button.cta { background: var(--green); color: var(--green-ink); font-family: var(--display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 7px 16px; margin: 0 4px; box-shadow: 0 4px 14px var(--green-glow); }
.nav button.cta:hover { filter: brightness(1.08); transform: translateY(-1px); }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabs button { display: grid; justify-items: center; gap: 3px; padding: 5px 2px; font-size: 11px; color: var(--muted); border-radius: 8px; text-align: center; font-weight: 500; }
.tabs button.on { color: var(--fg); }
.tabs button.on .ic { color: var(--green); }
.tabs button.play .ic { width: 40px; height: 40px; padding: 8px; margin-top: -16px; border-radius: 50%; background: var(--green); color: var(--green-ink); box-shadow: 0 4px 12px var(--green-glow), 0 0 0 4px var(--surface); }
@media (min-width: 900px) { .nav { display: flex; } .tabs { display: none; } }

.wrap { max-width: 1140px; margin: 0 auto; display: grid; gap: 20px; }
.narrow { max-width: 680px; width: 100%; margin: 0 auto; display: grid; gap: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); pointer-events: none; background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 10px; z-index: 30; width: max-content; max-width: calc(100% - 32px); font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
@media (min-width: 900px) { .toast { bottom: 28px; } }
body.ingame .toast { bottom: auto; top: calc(8px + env(safe-area-inset-top, 0px)); }

.phead { display: flex; align-items: end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.h1 { font-family: var(--display); font-size: clamp(26px, 6vw, 42px); line-height: 1.04; text-transform: uppercase; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
.h2 { font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.sec { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; box-shadow: var(--shadow); }
@media (min-width: 640px) { .card { padding: 16px 18px; } }
.list { display: grid; gap: 10px; }
.fchips { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; align-items: center; padding-bottom: 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.fchips::-webkit-scrollbar { display: none; }
@media (min-width: 640px) { .fchips { flex-wrap: wrap; overflow-x: visible; } }
.fchip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; color: var(--muted); white-space: nowrap; flex: none; }
.fchip:hover { color: var(--fg); border-color: var(--line-bright); }
.fchip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pill.live { color: var(--green); font-weight: 600; }
.pill.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-glow); }
.lnk { color: var(--fg); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-bright); text-underline-offset: 3px; }
.lnk:hover { text-decoration-color: var(--green); color: var(--green); }
.pn { font-weight: 500; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pn:hover { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
.mini { padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); font-size: 12.5px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.mini:hover { color: var(--fg); border-color: var(--line-bright); }
.mini.go { background: var(--green); border-color: var(--green); color: var(--green-ink); font-weight: 600; }
.mini.go:hover { filter: brightness(1.08); }
.ghost { padding: 9px 14px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 13.5px; font-weight: 500; text-align: center; background: var(--surface); }
.ghost:hover { color: var(--fg); border-color: var(--line-bright); background: var(--surface2); }
.ghost.dng { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.ghost.dng:hover { background: var(--red-glow); }
.btn { width: 100%; padding: 14px 18px; border-radius: 11px; background: var(--green); color: var(--green-ink); font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; text-align: center; box-shadow: 0 4px 16px var(--green-glow); }
.btn:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); }
.btn.alt { background: var(--surface2); color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.btn.alt:hover:not(:disabled) { border-color: var(--line-bright); }
.btn.sm { width: auto; padding: 10px 18px; font-size: 16px; }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.note-box { padding: 13px 16px; border-radius: 12px; border: 1px dashed var(--line-bright); background: color-mix(in srgb, var(--surface) 65%, transparent); color: var(--muted); font-size: 13.5px; }
.note-box b { color: var(--fg); font-weight: 600; }
.av { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line-bright); color: var(--fg); font-family: var(--display); font-weight: 600; font-size: 14px; flex: none; }
.av.me { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.av.lg { width: 68px; height: 68px; font-size: 26px; }
.scroll { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scroll-snap-type: x proximity; }
.bk-col { scroll-snap-align: start; }
.more { justify-self: center; }

.fgrid { display: grid; gap: 22px; }
@media (min-width: 960px) { .fgrid { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.mc { display: grid; gap: 11px; transition: border-color .15s ease, transform .15s ease; }
.mc:hover { border-color: var(--line-bright); }
.mc-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.mc-h time { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.mc-rows { display: grid; gap: 5px; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--surface2) 55%, transparent); cursor: pointer; transition: background .15s ease; }
.mc-rows:hover { background: var(--surface2); }
.mr { display: grid; grid-template-columns: minmax(0, 1fr) auto 2.2em; align-items: baseline; gap: 12px; color: var(--muted); }
.mr .pn, .mr > span:first-child { color: var(--muted); }
.mr .avg { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mr .lg { font-size: 22px; text-align: right; }
.mr.win .pn, .mr.win > span:first-child, .mr.win .lg { color: var(--fg); font-weight: 600; }
.mr.win .lg { color: var(--green); }
.mc-f { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.hl { padding: 2px 8px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--line); color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 500; }
.hl.ton80 { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 45%, transparent); background: var(--brass-glow); }
.ev-b { display: flex; gap: 14px; align-items: center; }
.trophy { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: rgba(242, 201, 76, .12); border: 1px solid rgba(242, 201, 76, .35); color: #f2c94c; flex: none; }
.side { display: grid; gap: 18px; }
@media (min-width: 960px) { .side { position: sticky; top: 76px; } }
.prow { display: grid; grid-template-columns: 22px auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow .rk { font-family: var(--display); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.prow .v { font-family: var(--display); font-size: 19px; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg); }

.tgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.tc { display: grid; gap: 9px; cursor: pointer; align-content: start; transition: transform .15s ease, border-color .15s ease; }
.tc:hover { border-color: var(--line-bright); transform: translateY(-2px); }
.tc-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.tc-h .pill { flex: none; margin-top: 3px; }
.tc-p { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.qm-names { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.chip.qm { min-height: 48px; font-size: 18px; }
.tc h3 { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: .02em; line-height: 1.15; text-wrap: balance; }
.bar { height: 6px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 999px; transition: width .3s ease; }
.champ { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 500; }
.champ .pn { color: var(--fg); }
.thead { display: grid; gap: 10px; }
.thead .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.back { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 14px; font-weight: 500; justify-self: start; padding: 4px 0; }
.back:hover { color: var(--fg); }
.tstat { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.seg2 { display: flex; gap: 4px; padding: 4px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); justify-self: start; max-width: 100%; overflow-x: auto; }
.seg2 button { padding: 8px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg2 button:hover { color: var(--fg); }
.seg2 button.on { background: var(--fg); color: var(--bg); font-weight: 600; }
.seg2.full { justify-self: stretch; width: 100%; }
.seg2.full button { flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
/* линии сетки держатся на равной высоте колонок и flex:1 у пар/слотов */
.bk { --bk-w: 212px; --bk-gap: 28px; display: grid; column-gap: var(--bk-gap); min-width: max-content; padding: 2px 2px 8px; }
.bk-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bk-lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-games { flex: 1; display: grid; grid-auto-rows: 1fr; }
.bk-pair { display: grid; grid-template-rows: 1fr 1fr; position: relative; }
.bk-pair.solo { grid-template-rows: 1fr; }
.bk-slot { display: flex; align-items: center; padding: 5px 0; position: relative; }
.bk-col:not(:last-child) .bk-pair:not(.solo)::after { content: ""; box-sizing: border-box; position: absolute; right: calc(var(--bk-gap) / -2); width: calc(var(--bk-gap) / 2); top: calc(25% - 1px); bottom: calc(25% - 1px); border: 2px solid var(--line-bright); border-left: 0; border-radius: 0 8px 8px 0; pointer-events: none; }

function snap() { undo.push(JSON.stringify(G)); if (undo.length > 40) undo.shift(); }

function throwDart(base, mult) {
  if (G.over || G.ask != null) return;
  if (base === 25 && mult === 3) return;
  snap();
  const p = G.players[G.cur];
  const remBefore = p.score - sum(G.visit);
  const isOneDartFinish = routeFor(remBefore, 1, G.dbl) !== null;
  const val = base * mult;
  const label = base === 0 ? '—' : base === 25 ? (mult === 2 ? 'Bull' : '25') : (mult === 1 ? String(base) : (mult === 2 ? 'D' : 'T') + base);
  G.visit.push({ val, m: mult, l: label, coAttempt: isOneDartFinish ? 1 : 0 });
  G.mult = 1; G.note = '';
  const rem = p.score - sum(G.visit);
  const bust = rem < 0 || (G.dbl && (rem === 1 || (rem === 0 && mult !== 2)));
  if (bust) { playSfx('bust'); endVisit(true, false, G.visit.length); }
  else if (rem === 0) { playSfx('win'); endVisit(false, true, G.visit.length); }
  else if (G.visit.length === 3) {
    const tot = sum(G.visit);
    playSfx(tot === 180 ? '180' : 'dart');
    endVisit(false, false, 3);
  } else {
    playSfx('dart');
  }
  saveGame(); render();
}

function endVisit(bust, win, n) {
  const p = G.players[G.cur];
  const start = p.score;
  const pts = bust ? 0 : sum(G.visit);
  if (G.entry === 'total') {
    // попытки на дубль без лишних вопросов: при закрытии — дротики сверх минимального маршрута, иначе 3 при закрытии в один дротик
    const min = (routeFor(start, 3, G.dbl) || []).length;
    p.coa += win ? Math.max(1, n - (min - 1)) : routeFor(start, 1, G.dbl) ? 3 : 0;
  } else {
    const attempts = G.visit.reduce((acc, d) => acc + (d.coAttempt || 0), 0);
    p.coa += attempts;
  }
  p.darts += n; p.points += pts; p.legDarts += n;
  if (p.legVisits < 3) { p.f9p += pts; p.f9d += n; }
  p.legVisits++;
  p.last = bust ? 'перебор' : String(pts);
  G.log.push({ p: G.cur, leg: G.legNo, s: start, pts, n, b: bust ? 1 : 0, d: G.entry !== 'total' ? G.visit.map(x => x.l) : null });
  G.prev = { i: G.cur, d: G.entry !== 'total' ? G.visit.map(x => x.l) : null, pts, bust };
  if (!bust) {
    p.score -= pts;
    if (pts > p.highest) p.highest = pts;
    if (pts >= 100) p.c100++;
    if (pts >= 140) p.c140++;
    if (pts === 180) p.c180++;
  }
  G.visit = [];
  if (win) {
    if (pts > p.hco) p.hco = pts;
    if (!p.bl || p.legDarts < p.bl) p.bl = p.legDarts;
    return legWon();
  }
  G.cur = (G.cur + 1) % G.players.length;
}

function legWon() {
  const p = G.players[G.cur];
  p.legs++;
  G.winner = G.cur;
  tapLock = Date.now() + 450;
  if (p.legs >= G.legsToWin) { G.over = 'match'; commitMatch(); }
  else G.over = 'leg';
}

function submitTotal(pts) {
  if (G.over || G.ask != null) return;
  S.buf = '';
  if (!Number.isInteger(pts) || pts < 0 || pts > 180) { G.note = 'Введите целое число от 0 до 180'; return render(); }
  if (IMPOSSIBLE.has(pts)) { G.note = pts + ' нельзя набрать тремя дротиками'; return render(); }
  const p = G.players[G.cur];
  const rem = p.score - pts;
  if (rem === 0) {
    const ok = [1, 2, 3].filter(n => routeFor(pts, n, G.dbl));
    if (!ok.length) { G.note = pts + ' нельзя закрыть ' + (G.dbl ? 'через дубль' : 'тремя дротиками'); return render(); }
    snap(); G.note = ''; G.ask = pts;
    if (ok.length === 1) return finishAsk(ok[0]);
    saveGame(); return render();
  }
  snap();
  G.note = '';
  G.visit = [{ val: pts, m: 1, l: String(pts) }];
  if (rem < 0 || (G.dbl && rem === 1)) { playSfx('bust'); endVisit(true, false, 3); }
  else { playSfx(pts === 180 ? '180' : 'dart'); endVisit(false, false, 3); }
  saveGame(); render();
}

function doUndo() {

function commitMatch() {
  const ids = G.players.map(p => p.id).filter(Boolean);
  const x = G.ctx ? readyGame(G.ctx.tid, G.ctx.r, G.ctx.i) : null;

  const lost = G.ctx && !t;
  if (!ids.length) { G.res = { msg: 'Матч гостей не попадает в ленту. Выберите игроков из базы, чтобы результат сохранился.' }; return; }
  const m = {
    id: G.id, t: Date.now(), tid: t ? t.id : null, off: !!(t && t.official), st: 'ok', by: ids.includes('me') ? 'me' : ids[0],
    mode: G.mode, ltw: G.legsToWin, dbl: G.dbl, w: G.winner,

    log: G.log

  db.matches.push(m);

    const la = G.players.find(p => p.id === x.a).legs, lb = G.players.find(p => p.id === x.b).legs;
    x.g.res = { la, lb, w: G.players[G.winner].id, mid: m.id };
  }

// false — результат нельзя снять (от него зависят сыгранные или идущие матчи)
function uncommitMatch(id) {
  const hits = [];
  db.tournaments.forEach(t => t.games.forEach(g => { if (g.res && g.res.mid === id) hits.push([t, g]); }));
  if (hits.some(([t, g]) => !canClearResult(t, g))) return false;
  hits.forEach(([, g]) => { g.res = null; });
  const k = db.matches.findIndex(m => m.id === id);

  });

  } else {
    h += '<div class="pad"><div class="seg2 full ent" role="group" aria-label="Ввод очков">' + [['total', 'Сумма'], ['darts', 'По дротикам']].map(([v, l]) => '<button class="' + (g.entry === v ? 'on' : '') + '" data-act="entry" data-v="' + v + '" aria-pressed="' + (g.entry === v) + '">' + l + '</button>').join('') + '</div>';
    if (!darts) {
      h += '<div class="presets">' + [0, 26, 45, 60, 100, 140, 180].map(v => '<button class="key" data-act="preset" data-v="' + v + '">' + v + '</button>').join('') + '</div>';
      h += '<div class="numpad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => '<button class="key" data-act="tdig" data-v="' + d + '">' + d + '</button>').join('') +
        '<button class="key fn" data-act="undo"' + ud + '>Отмена</button><button class="key" data-act="tdig" data-v="0">0</button><button class="key ok" data-act="tok"' + (S.buf ? '' : ' disabled') + '>ОК</button></div>';
    } else {
      // нужен дубль/трипл, а он не включён — подсвечиваем переключатель, иначе саму цифру
      const want = next && next.m > 1 && next.m !== g.mult ? next.m : 0, hit = x => next && next.base === x && next.m === g.mult ? ' rec' : '';
      const pref = g.mult === 2 ? 'D' : g.mult === 3 ? 'T' : '', mc = g.mult === 2 ? ' m2' : g.mult === 3 ? ' m3' : '';
      h += '<div class="keys">';
      for (let k = 1; k <= 20; k++) h += '<button class="key' + mc + hit(k) + '" data-act="dart" data-v="' + k + '">' + pref + k + '</button>';
      h += '<button class="key fn" data-act="undo"' + ud + '>Отмена</button><button class="key fn" data-act="dart" data-v="0">Мимо</button>' +
        '<button class="key' + hit(25) + '" data-act="dart" data-v="25"' + (g.mult === 3 ? ' disabled' : '') + '>' + (g.mult === 2 ? 'Bull' : '25') + '</button>' +
        [[2, 'Дубль'], [3, 'Трипл']].map(([m, l]) => '<button class="key fn tg' + (g.mult === m ? ' on' : '') + (want === m ? ' rec' : '') + '" data-act="mult" data-v="' + m + '" aria-pressed="' + (g.mult === m) + '">' + l + '</button>').join('') + '</div>';
    }
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="g-stats-area">' + gStatTable(g.players) + '</div></div>';

  if (g.over) {
    const w = g.players[g.winner], leg = g.over === 'leg';
    h += '<div class="over" role="dialog" aria-modal="true" aria-label="' + (leg ? 'Лег выигран' : 'Матч окончен') + '"><div class="ocard center"><div class="ohead"><span class="label">' + (leg ? 'Лег ' + g.legNo + ' выигран' : 'Победитель матча') + '</span><button class="ghost sm" data-act="undo">Отменить последний бросок</button></div>' +
      '<h2>' + esc(w.name) + '</h2><div class="score">' + g.players.map(q => '<span>' + esc(q.name) + ' <b>' + q.legs + '</b></span>').join('') + '</div>';
    if (leg) {
      const L = g.log.filter(e => e.leg === g.legNo && e.p === g.winner), lp = L.reduce((a, e) => a + e.pts, 0), ld = L.reduce((a, e) => a + e.n, 0);
      h += '<p class="meta">' + ld + ' ' + pl(ld, 'дротик', 'дротика', 'дротиков') + (L.length ? ' · закрытие ' + L[L.length - 1].pts : '') + ' · ср. лега ' + avg3(lp, ld) + '</p>';
      h += '<button class="btn" data-act="next">Лег ' + (g.legNo + 1) + ' · начинает ' + esc(g.players[(g.starter + 1) % n].name) + '</button>';
    } else {
      if (g.res && g.res.msg) h += '<p class="msg">' + esc(g.res.msg) + '</p>';
      h += n === 2 ? '<div class="cmp">' + statRows(gStat(g.players[0]), gStat(g.players[1])) + '</div>' : gStatTable(g.players);
      h += '<div class="row2">' + (g.ctx ? '<button class="btn" data-act="leave" data-v="tour">К турниру</button>' : '<button class="btn" data-act="rematch">Реванш</button>') + '<button class="btn alt" data-act="leave" data-v="play">Готово</button></div>';
    }
    h += '</div></div>';
  }
  return h;
}

// экран не гаснет во время игры
function wakeOn() {
  if (wake || !navigator.wakeLock || document.visibilityState !== 'visible') return;
  wake = 'pending';
  try {
    navigator.wakeLock.request('screen').then(l => {
      l.addEventListener('release', () => { if (wake === l) wake = null; });
      if (wake === 'pending' && document.body.classList.contains('ingame')) wake = l;
      else { l.release().catch(() => {}); if (wake === 'pending') wake = null; }
    }).catch(() => { if (wake === 'pending') wake = null; });
  } catch (e) { wake = null; }
}
function wakeOff() {
  if (wake && wake !== 'pending') wake.release().catch(() => {});
  wake = null;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && document.body.classList.contains('ingame')) wakeOn(); });

      break;
    }

      db = makeSeed(); saveDb(); recalc();

document.addEventListener('input', e => {

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && anyModal()) { closeModals(); render(); return; }
  const t = e.target;
  const inInput = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
  if (e.key === 'Enter' && t && t.id === 'nt-q') {
    e.preventDefault();
    const vis = [...document.querySelectorAll('.pick[data-key]:not([hidden])')];
    if (t.value.trim() && vis.length === 1) { vis[0].click(); const ne = $('nt-q'); if (ne) ne.focus(); }
    else if (t.value.trim() && !vis.length) addNtPlayer();
    return;
  }
  if (e.key === 'Enter' && t && /^me-/.test(t.id)) { const sb = $('app').querySelector('[data-act="savename"]'); if (sb) sb.click(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button') { e.preventDefault(); t.click(); return; }

  if (!inInput && !anyModal() && !e.ctrlKey && !e.metaKey && !e.altKey && R === 'play' && S.inGame && G) {
    if (G.over === 'leg' && e.key === 'Enter') { e.preventDefault(); if (Date.now() >= tapLock) nextLeg(); return; }
    if (G.over) return;
    if (G.ask != null) { if (/^[123]$/.test(e.key)) finishAsk(+e.key); return; }
    if (G.entry === 'total') {
      if (/^[0-9]$/.test(e.key)) tDig(e.key);
      else if (e.key === 'Enter') { e.preventDefault(); if (S.buf) submitTotal(+S.buf); }
      else if (e.key === 'Backspace') {
        e.preventDefault();
        // зажатый Backspace стирает цифры, но не отменяет бросок
        if (S.buf) tErase();
        else if (!e.repeat && Date.now() - eraseT > 700) doUndo();
      }
    } else if (e.key === '0') throwDart(0, 1);
    else if (e.key === 'Backspace') { e.preventDefault(); if (!e.repeat) doUndo(); }
  }
});

function addNtPlayer() {
  const el = $('nt-q'), nt = S.nt;
  if (!el || !nt) return;
  const name = el.value.trim().replace(/\s+/g, ' ');
  if (!name) { el.focus(); return; }
  const existed = ntExact(name);
  const p = addLocalPlayer(name, (nt.city || '').trim());
  if (!p) return;
  if (nt.sel.includes(p.id)) toast(p.name + ' уже в списке участников.');
  else if (nt.sel.length >= BR_MAX) toast('Максимум ' + BR_MAX + ' участника.');
  else { nt.sel.push(p.id); toast(existed ? p.name + ' добавлен в турнир.' : 'Новый игрок ' + p.name + ' добавлен в турнир.'); }
  nt.q = ''; nt.err = '';
  render();
  const ne = $('nt-q');
  if (ne) ne.focus();
}

  applyTheme();
  loadDb();
  const su = lsGet('oche2.setup');
  S.setup = su && Array.isArray(su.names) && su.names.length ? su : defaultSetup();
  const g = lsGet('oche2.game');
  if (g && Array.isArray(g.players) && g.players.length && g.mode) {
    G = g;
    const u = lsGet('oche2.undo');
    undo = Array.isArray(u) ? u : [];
    if (G.ctx) {
      const x = readyGame(G.ctx.tid, G.ctx.r, G.ctx.i), ids = G.players.map(p => p.id);
      if (!x || !ids.includes(x.a) || !ids.includes(x.b)) G.ctx = null;
    }
  }
  const h = location.hash.slice(1);
  if (h && validRoute(h)) R = h;
  render();
}
boot();
</script>
</body>
</html>
