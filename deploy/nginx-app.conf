# Содержимое сайта: подключается из /etc/nginx/sites-available/oche и обновляется вместе с кодом
# (deploy.sh → nginx-sync.sh: проверка nginx -t и перезагрузка).
root /srv/oche/app;
client_max_body_size 128k;

gzip on;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css image/svg+xml;

include /srv/oche/app/deploy/nginx-headers.conf;

# страница и общие модули (сетка, упражнения); остальные файлы репозитория наружу не отдаём
location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; include /srv/oche/app/deploy/nginx-headers.conf; }
location = /index.html { add_header Cache-Control "no-cache"; include /srv/oche/app/deploy/nginx-headers.conf; }
location = /shared/bracket.js { add_header Cache-Control "no-cache"; include /srv/oche/app/deploy/nginx-headers.conf; }
location = /shared/games.js { add_header Cache-Control "no-cache"; include /srv/oche/app/deploy/nginx-headers.conf; }
location = /api.js { add_header Cache-Control "no-cache"; include /srv/oche/app/deploy/nginx-headers.conf; }
location = /vendor/qrcode.js { expires 30d; }
# приложение на экране телефона: оболочка без сети (sw.js), значок, манифест
location = /sw.js { add_header Cache-Control "no-cache"; include /srv/oche/app/deploy/nginx-headers.conf; }
location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; include /srv/oche/app/deploy/nginx-headers.conf; }
location /icons/ { expires 7d; }
location /fonts/ { expires 30d; }
location = /robots.txt { expires 1d; }

# загруженные фото: имена случайные и не меняются
location /uploads/ {
  alias /srv/oche/uploads/;
  expires 30d;
  add_header Cache-Control "public, immutable";
  include /srv/oche/app/deploy/nginx-headers.conf;
}


# фото страница присылает уже сжатыми, до 3 МБ
location = /api/photos {
  client_max_body_size 4m;
  limit_req zone=oche_req burst=100 nodelay;
  limit_req_status 429;
  proxy_pass http://oche_api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
# документы заявок на звания: фото или PDF до 8 МБ
location = /api/titles/docs {
  client_max_body_size 9m;
  limit_req zone=oche_req burst=100 nodelay;
  limit_req_status 429;
  proxy_pass http://oche_api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
# поток событий турнира (табло, зрители): долгие соединения, не больше 60 с одного адреса
location ~ ^/api/tournaments/[^/]+/stream$ {
  limit_conn oche_conn 60;
  proxy_pass http://oche_api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 120s;
}

# демо-сервер: та же программа с демо-базой (deploy/demo-sync.sh), страница в режиме «Демо» ходит сюда
location /demo/uploads/ {
  alias /srv/oche/demo-uploads/;
  expires 30d;
  add_header Cache-Control "public, immutable";
  include /srv/oche/app/deploy/nginx-headers.conf;
}
location ~ ^/demo/api/tournaments/[^/]+/stream$ {
  limit_conn oche_conn 60;
  rewrite ^/demo(/api/.*)$ $1 break;
  proxy_pass http://127.0.0.1:3001;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 120s;
}
location /demo/api/ {
  client_max_body_size 9m;
  limit_req zone=oche_req burst=300 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:3001/api/;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;
}

location /api/ {
  limit_req zone=oche_req burst=500 nodelay;
  limit_req_status 429;
  proxy_pass http://oche_api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;
}

location / { return 404; }
