# Шаблон: __DOMAIN__ подставляет setup.sh. HTTPS добавляет certbot.
upstream oche_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  root /srv/oche/app;
  client_max_body_size 128k;

  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # страница и общие модули (сетка, упражнения); остальные файлы репозитория наружу не отдаём
  location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /shared/bracket.js { add_header Cache-Control "no-cache"; }
  location = /shared/games.js { add_header Cache-Control "no-cache"; }
  location = /api.js { add_header Cache-Control "no-cache"; }
  location = /vendor/qrcode.js { expires 30d; }

  # загруженные фото: имена случайные и не меняются
  location /uploads/ {
    alias /srv/oche/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff;
  }

  # фото страница присылает уже сжатыми, до 3 МБ
  location = /api/photos {
    client_max_body_size 4m;
    proxy_pass http://oche_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://oche_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location / { return 404; }
}
