# Шаблон сайта: __DOMAIN__ подставляет setup.sh (или nginx-sync.sh). HTTPS добавляет certbot.
# Пути, кэш, лимиты и заголовки — в nginx-app.conf: он берётся прямо из репозитория и обновляется вместе с кодом.
upstream oche_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

# защита от потока запросов с одного адреса; щедро — в зале весь бар за одним IP
limit_req_zone $binary_remote_addr zone=oche_req:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=oche_conn:10m;

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  include /srv/oche/app/deploy/nginx-app.conf;
}
