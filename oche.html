* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 0 calc(90px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  min-height: 100dvh;
  overflow-x: hidden;
  transition: background-color .2s ease, color .2s ease;
}
@media (min-width: 768px) {
  body {
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
}
@media (min-width: 900px) {
  body {
    padding-block: 0 56px;
    padding-left: max(28px, env(safe-area-inset-left, 0px));
    padding-right: max(28px, env(safe-area-inset-right, 0px));
  }
}
button, input, [role="button"], [data-act], [data-hit] {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; transition: all .15s ease; user-select: none; }
button:focus-visible, input:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.meta { color: var(--muted); font-size: 13px; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 15px; height: 15px; stroke-width: 2.2; }

.top-wrap {
  position: sticky; top: 0; z-index: 10;
  margin-inline: calc(-1 * max(12px, env(safe-area-inset-left, 0px)));
  padding-inline: max(12px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  margin-bottom: 16px;
}
@media (min-width: 768px) {
  .top-wrap {
    margin-inline: calc(-1 * max(20px, env(safe-area-inset-left, 0px)));
    padding-inline: max(20px, env(safe-area-inset-left, 0px));
  }
}
@media (min-width: 900px) {
  .top-wrap {
    margin-inline: calc(-1 * max(28px, env(safe-area-inset-left, 0px)));
    padding-inline: max(28px, env(safe-area-inset-left, 0px));
    margin-bottom: 22px;
  }
}
.top { max-width: 1140px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
.brand svg { width: 29px; height: 29px; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
.top-actions { display: flex; align-items: center; gap: 6px; }
.demo { font-size: 11px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
@media (max-width: 400px) { .demo { display: none; } }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { color: var(--fg); border-color: var(--line-bright); background: var(--surface2); }
.nav { display: none; gap: 4px; align-items: center; margin-left: auto; margin-right: 8px; }
.nav button { padding: 8px 14px; border-radius: 9px; color: var(--muted); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.nav button:hover { color: var(--fg); background: color-mix(in srgb, var(--surface2) 55%, transparent); }
.nav button.on { color: var(--fg); background: var(--surface2); box-shadow: inset 0 0 0 1px var(--line); }
.nav button.cta { background: var(--green); color: var(--green-ink); font-family: var(--display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 7px 16px; margin: 0 4px; box-shadow: 0 4px 14px var(--green-glow); }
.nav button.cta:hover { filter: brightness(1.08); transform: translateY(-1px); }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabs button { display: grid; justify-items: center; gap: 3px; padding: 5px 2px; font-size: 11px; color: var(--muted); border-radius: 8px; text-align: center; font-weight: 500; }
.tabs button.on { color: var(--fg); }
.tabs button.on .ic { color: var(--green); }
.tabs button.play .ic { width: 40px; height: 40px; padding: 8px; margin-top: -16px; border-radius: 50%; background: var(--green); color: var(--green-ink); box-shadow: 0 4px 12px var(--green-glow), 0 0 0 4px var(--surface); }
@media (min-width: 900px) { .nav { display: flex; } .tabs { display: none; } }

.wrap { max-width: 1140px; margin: 0 auto; display: grid; gap: 20px; }
.narrow { max-width: 680px; width: 100%; margin: 0 auto; display: grid; gap: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 10px; z-index: 30; width: max-content; max-width: calc(100% - 32px); font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
@media (min-width: 900px) { .toast { bottom: 28px; } }

.phead { display: flex; align-items: end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.h1 { font-family: var(--display); font-size: clamp(26px, 6vw, 42px); line-height: 1.04; text-transform: uppercase; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
.sub { color: var(--muted); margin-top: 6px; max-width: 60ch; font-size: 14px; }
.h2 { font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.sec { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; box-shadow: var(--shadow); }
@media (min-width: 640px) { .card { padding: 16px 18px; } }
.list { display: grid; gap: 10px; }
.fchips { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; align-items: center; padding-bottom: 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.fchips::-webkit-scrollbar { display: none; }
@media (min-width: 640px) { .fchips { flex-wrap: wrap; overflow-x: visible; } }
.fchip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; color: var(--muted); white-space: nowrap; flex: none; }
.fchip:hover { color: var(--fg); border-color: var(--line-bright); }
.fchip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.bdg { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface2); font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.bdg.off { color: var(--brass); background: var(--brass-glow); border-color: color-mix(in srgb, var(--brass) 50%, transparent); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pill.live { color: var(--green); font-weight: 600; }
.pill.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-glow); }
.lnk { color: var(--fg); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-bright); text-underline-offset: 3px; }
.lnk:hover { text-decoration-color: var(--green); color: var(--green); }
.pn { font-weight: 500; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pn:hover { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
.mini { padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); font-size: 12.5px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.mini:hover { color: var(--fg); border-color: var(--line-bright); }
.mini.go { background: var(--green); border-color: var(--green); color: var(--green-ink); font-weight: 600; }
.mini.go:hover { filter: brightness(1.08); }
.mini.brass { background: var(--brass-glow); border-color: color-mix(in srgb, var(--brass) 55%, transparent); color: var(--brass); font-weight: 600; }
.ghost { padding: 9px 14px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 13.5px; font-weight: 500; text-align: center; background: var(--surface); }
.ghost:hover { color: var(--fg); border-color: var(--line-bright); background: var(--surface2); }
.ghost.dng { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.ghost.dng:hover { background: var(--red-glow); }
.btn { width: 100%; padding: 14px 18px; border-radius: 11px; background: var(--green); color: var(--green-ink); font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; text-align: center; box-shadow: 0 4px 16px var(--green-glow); }
.btn:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); }
.btn.alt { background: var(--surface2); color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.btn.alt:hover:not(:disabled) { border-color: var(--line-bright); }
.btn.sm { width: auto; padding: 10px 18px; font-size: 16px; }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.note-box { padding: 13px 16px; border-radius: 12px; border: 1px dashed var(--line-bright); background: color-mix(in srgb, var(--surface) 65%, transparent); color: var(--muted); font-size: 13.5px; }
.note-box b { color: var(--fg); font-weight: 600; }
.av { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line-bright); color: var(--brass); font-family: var(--display); font-weight: 600; font-size: 14px; flex: none; }
.av.me { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.av.lg { width: 68px; height: 68px; font-size: 26px; }
.scroll { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scroll-snap-type: x proximity; }
.bk-col { scroll-snap-align: start; }
.more { justify-self: center; }

.fgrid { display: grid; gap: 22px; }
@media (min-width: 960px) { .fgrid { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.mc { display: grid; gap: 11px; transition: border-color .15s ease, transform .15s ease; }
.mc:hover { border-color: var(--line-bright); }
.mc-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.mc-h time { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.mc-rows { display: grid; gap: 5px; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--surface2) 55%, transparent); cursor: pointer; transition: background .15s ease; }
.mc-rows:hover { background: var(--surface2); }
.mr { display: grid; grid-template-columns: minmax(0, 1fr) auto 2.2em; align-items: baseline; gap: 12px; color: var(--muted); }
.mr .pn, .mr > span:first-child { color: var(--muted); }
.mr .avg { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mr .lg { font-size: 22px; text-align: right; }
.mr.win .pn, .mr.win > span:first-child, .mr.win .lg { color: var(--fg); font-weight: 600; }
.mr.win .lg { color: var(--green); }
.mc-f { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.hl { padding: 2px 8px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--line); color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 500; }
.hl.ton80 { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 45%, transparent); background: var(--brass-glow); }
.st { display: inline-flex; align-items: center; gap: 4px; }
.st.pend { color: var(--brass); }
.ev-b { display: flex; gap: 14px; align-items: center; }
.trophy { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--brass-glow); border: 1px solid color-mix(in srgb, var(--brass) 40%, transparent); color: var(--brass); flex: none; }
.side { display: grid; gap: 18px; }
@media (min-width: 960px) { .side { position: sticky; top: 76px; } }

.resume { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 15px 18px; border-radius: 14px; border: 1px solid var(--brass); background: var(--surface); box-shadow: 0 4px 20px var(--brass-glow); }
.resume b { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: .03em; color: var(--brass); }
.resume .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.phero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.phero h1 { font-family: var(--display); font-size: clamp(26px, 6vw, 38px); text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; }
.phero .row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 6px; }
.rbox { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: grid; gap: 2px; min-width: 0; }
.tile .v { font-family: var(--display); font-size: 27px; font-weight: 600; line-height: 1.1; }
.tile .s { color: var(--muted); font-size: 12px; }

@media (min-width: 640px) { .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.chart { position: relative; height: 200px; user-select: none; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ch-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.ch-tick { fill: var(--muted); font-size: 11px; font-family: var(--body); font-variant-numeric: tabular-nums; }
.ch-area { fill: var(--green); opacity: .16; }
.ch-line { stroke: var(--green); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ch-dot { fill: var(--green); stroke: var(--surface); stroke-width: 2; }
.ch-end { fill: var(--fg); font-size: 13px; font-family: var(--display); font-weight: 600; }
.ch-x { stroke: var(--brass); stroke-width: 1; stroke-dasharray: 3 3; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1.35; white-space: nowrap; z-index: 5; box-shadow: var(--shadow); }
.pgrid { display: grid; gap: 22px; }
@media (min-width: 960px) { .pgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.trow { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 11px 14px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.trow .r { color: var(--brass); font-weight: 600; white-space: nowrap; }

.game { display: grid; gap: 10px; }
/* Tablet & Desktop 2-column widescreen cockpit */
@media (min-width: 820px) {
  .game {
    grid-template-columns: minmax(340px, 1fr) minmax(380px, 1.12fr);
    grid-template-areas:
      "head pad"
      "players pad"
      "stats pad";
    align-items: start;
    gap: 16px;
  }
  .g-head-area { grid-area: head; }
  .g-players-area { grid-area: players; }
  .g-pad-area { grid-area: pad; position: sticky; top: 76px; }
  .g-stats-area { grid-area: stats; }
}
.col { display: grid; gap: 10px; min-width: 0; }
@media (min-width: 820px) { .col { gap: 14px; } }
.ghead { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); padding: 9px 13px; border-radius: 12px; }
.ghead-acts { display: flex; gap: 6px; align-items: center; flex: none; }
body.ingame { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }

@media (max-width: 819px) {
  body.ingame .top-wrap { display: none; }
  body.ingame { padding-top: max(8px, env(safe-area-inset-top, 0px)); }
}
.players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.pl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; position: relative; overflow: hidden; transition: border-color .2s ease, box-shadow .2s ease; }
@media (min-width: 820px) { .pl { padding: 14px 16px; gap: 4px; border-radius: 14px; } }
.pl.act { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green), 0 4px 16px var(--green-glow); }
.pl .nm { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.pl .nm span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .legs { color: var(--brass); font-family: var(--display); font-size: 16px; padding: 1px 7px; border-radius: 6px; background: var(--brass-glow); flex: none; }
.pl .big { font-size: clamp(36px, 8vw, 56px); line-height: 1; font-weight: 700; letter-spacing: .01em; margin-block: 2px; }
.pl.act .big { color: var(--green); }
.pl .sub { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 11.5px; margin-top: 1px; white-space: nowrap; }
.pl .co-chip { font-family: var(--display); font-size: 12.5px; color: var(--brass); letter-spacing: .03em; min-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.visit { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: grid; gap: 9px; box-shadow: var(--shadow); }
@media (min-width: 820px) { .visit { padding: 15px; gap: 12px; border-radius: 14px; } }
.prev { font-size: 12.5px; color: var(--muted); padding: 5px 9px; border-radius: 8px; background: var(--surface2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.slot { height: 46px; border-radius: 9px; border: 1px dashed var(--line-bright); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--display); font-size: 21px; font-weight: 600; position: relative; }
@media (min-width: 820px) { .slot { height: 54px; font-size: 23px; } }
.slot small { font-family: var(--body); font-size: 10px; color: var(--muted); font-weight: 500; line-height: 1; margin-top: 1px; }
.slot.f { border-style: solid; border-color: var(--line-bright); background: var(--surface2); }
.slot.target { border-color: color-mix(in srgb, var(--brass) 55%, transparent); color: color-mix(in srgb, var(--brass) 55%, transparent); }
.slot.dbl { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 50%, transparent); }
.slot.trp { color: var(--green); border-color: color-mix(in srgb, var(--green) 50%, transparent); }

.hint { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 26px; flex-wrap: wrap; }
.route { font-family: var(--display); font-size: 20px; font-weight: 600; color: var(--brass); letter-spacing: .04em; display: inline-flex; align-items: center; gap: 6px; }
.note { color: var(--red); font-weight: 600; }
.pad { display: grid; gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button { padding: 10px 4px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface2); font-size: 13px; font-weight: 600; text-align: center; }
.seg button:hover:not(:disabled) { border-color: var(--line-bright); }
.seg button.on { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.seg button:disabled { opacity: .38; cursor: default; }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.key { height: 46px; border-radius: 9px; background: var(--surface2); border: 1px solid var(--line); font-family: var(--display); font-size: 19px; font-weight: 600; text-align: center; position: relative; }
@media (min-width: 820px) { .keys { gap: 7px; } .key { height: 50px; font-size: 20px; } }
.key:hover:not(:disabled) { border-color: var(--line-bright); background: var(--surface3); }
.key:active:not(:disabled) { background: var(--green); color: var(--green-ink); transform: scale(.96); }
.key:disabled { opacity: .32; cursor: not-allowed; }
.key.m2 { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 35%, var(--line)); }
.key.m3 { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, var(--line)); }
.key.rec { box-shadow: 0 0 0 2px var(--brass), 0 0 12px var(--brass-glow); border-color: var(--brass); }
.keys3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.keys3 .key { font-size: 14.5px; font-family: var(--body); font-weight: 600; }
.totrow { display: flex; gap: 8px; }
.totrow input { flex: 1; min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-family: var(--display); font-size: 26px; text-align: center; }
.totrow .btn { width: auto; padding: 0 22px; font-size: 17px; }
.presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.ask { display: grid; gap: 12px; padding: 16px; border-radius: 14px; border: 1px solid var(--brass); background: var(--surface); box-shadow: 0 4px 20px var(--brass-glow); }
.stats { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.stats table { width: 100%; border-collapse: collapse; font-size: 13px; }
.stats th, .stats td { text-align: right; padding: 8px 5px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stats th:first-child, .stats td:first-child { text-align: left; max-width: 120px; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.stats th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.stats tr:last-child td { border-bottom: 0; }
.kbd-bar { display: none; font-size: 12px; color: var(--muted); justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 9px; background: color-mix(in srgb, var(--surface) 75%, transparent); border: 1px solid var(--line); }
.kbd-bar kbd { padding: 1px 5px; border-radius: 4px; background: var(--surface2); border: 1px solid var(--line-bright); color: var(--fg); font-family: var(--body); font-size: 11px; }
@media (min-width: 900px) and (hover: hover) { .kbd-bar { display: flex; } }

/* Interactive SVG Dartboard */
.board-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; place-items: center; gap: 10px; position: relative; }
.board-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.dartboard { width: min(100%, 340px); aspect-ratio: 1; display: block; cursor: crosshair; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
@media (min-width: 820px) { .dartboard { width: min(100%, 380px); } }
.dartboard [data-hit] { transition: opacity .12s ease, filter .12s ease; }
.dartboard [data-hit]:hover, .dartboard [data-hit]:active { filter: brightness(1.35); stroke: var(--brass); stroke-width: 1.5px; }
.dartboard [data-hit].rec-seg { stroke: #ffd86b; stroke-width: 2.2px; filter: drop-shadow(0 0 6px rgba(255,216,107,.85)); animation: segPulse 1.3s ease-in-out infinite; }
@keyframes segPulse { 50% { filter: brightness(1.45) drop-shadow(0 0 8px rgba(255,216,107,1)); } }

/* Modals & Overlays */
.over { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; place-items: end center; padding: 0; z-index: 25; overflow-y: auto; }
.over .ocard { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--line-bright); border-radius: 20px 20px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; box-shadow: var(--shadow); max-height: 92dvh; overflow-y: auto; }

  .over { place-items: center; padding: 20px; }
  .over .ocard { border-radius: 16px; padding: 24px; max-height: none; }
}
.over .ocard.center { text-align: center; border-color: var(--green); }
.over h2 { font-family: var(--display); font-size: 30px; text-transform: uppercase; letter-spacing: .04em; text-wrap: balance; line-height: 1.1; }
.over .score { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font-family: var(--display); font-size: 22px; color: var(--muted); }
.over .score b { color: var(--fg); font-weight: 600; }
.over .msg { font-size: 14px; color: var(--muted); }
.cmp-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.cmp-row:last-child { border-bottom: 0; }
.cmp-row > span:first-child { text-align: left; font-family: var(--display); font-size: 16px; font-weight: 600; }
.cmp-row > span:nth-child(2) { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; text-align: center; }
.cmp-row > span:last-child { text-align: right; font-family: var(--display); font-size: 16px; font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.uchip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.ucode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 1px 6px; border-radius: 5px; background: var(--surface2); border: 1px solid var(--line-bright); color: var(--brass); white-space: nowrap; }
.uhandle { color: var(--muted); font-size: 12px; font-weight: 400; white-space: nowrap; }

function recalc() {

const gameAt = (t, r, i) => t.games.find(g => g.r === r && g.i === i);
function gamePlayersIn(t, g) {
  if (t.format === 'rr' || g.r === 0) return [g.a, g.b];
  const x = gameAt(t, g.r - 1, 2 * g.i), y = gameAt(t, g.r - 1, 2 * g.i + 1);

const koRounds = t => Math.log2(t.players.length);

function tStatus(t) {

function standings(t) {
  const s = {};
  t.players.forEach(id => s[id] = { id, p: 0, w: 0, l: 0, lf: 0, la: 0, pts: 0, darts: 0 });
  t.games.forEach(g => {
    if (!g.res) return;
    const A = s[g.a], B = s[g.b];
    if (!A || !B) return;
    A.p++; B.p++; A.lf += g.res.la; A.la += g.res.lb; B.lf += g.res.lb; B.la += g.res.la;
    if (g.res.w === g.a) { A.w++; B.l++; } else { B.w++; A.l++; }
    const m = MBY[g.res.mid];
    if (m) m.pl.forEach(l => { if (s[l.id]) { s[l.id].pts += l.pts; s[l.id].darts += l.darts; } });
  });
  return Object.values(s).sort((x, y) => y.w - x.w || (y.lf - y.la) - (x.lf - x.la) || y.lf - x.lf);
}

function placeOf(t, pid) {

  if (champion(t) === pid) return 'Победитель';

  if (!best) return '—';

  return best.r === koRounds(t) - 1 ? 'Финалист' : roundLabel(t, best.r);
}

function pStats(pid, offOnly) {
  const ms = db.matches.filter(m => (!offOnly || m.off) && m.pl.some(l => l.id === pid)).sort((a, b) => b.t - a.t);
  const S = { ms, n: ms.length, w: 0, pts: 0, darts: 0, f9s: 0, f9n: 0, coh: 0, coa: 0, hco: 0, c180: 0, c140: 0, c100: 0, bl: 0, hi: 0 };
  ms.forEach(m => {

    S.coh += l.coh; S.coa += l.coa;

}

function feedItems() {

function drawChart() {
  const el = $('chart');
  if (!el || !CHART) return;
  const d = CHART, W = Math.max(260, el.clientWidth), H = Math.max(150, el.clientHeight);
  if (d.length < 2) { el.innerHTML = '<p class="meta">Нужно хотя бы два матча для графика.</p>'; return; }
  const padL = 32, padR = 42, padT = 14, padB = 26;
  const vs = d.map(x => x.v);
  let lo = Math.max(0, Math.floor((Math.min(...vs) - 3) / 10) * 10), hi = Math.ceil((Math.max(...vs) + 3) / 10) * 10;
  if (hi <= lo) hi = lo + 20;
  const step = hi - lo > 40 ? 20 : 10;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => padL + i * (W - padL - padR) / (d.length - 1);
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">';
  for (let v = lo; v <= hi; v += step) s += '<line class="ch-grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ch-tick" x="' + (padL - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
  const line = d.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  s += '<path class="ch-area" d="' + line + ' L' + x(d.length - 1).toFixed(1) + ' ' + y(lo) + ' L' + padL + ' ' + y(lo) + ' Z"/>';
  s += '<path class="ch-line" d="' + line + '"/>';
  s += '<text class="ch-tick" x="' + padL + '" y="' + (H - 6) + '">' + fmtDate(d[0].t) + '</text><text class="ch-tick" x="' + (W - padR) + '" y="' + (H - 6) + '" text-anchor="end">' + fmtDate(d[d.length - 1].t) + '</text>';
  const L = d.length - 1;
  s += '<circle class="ch-dot" cx="' + x(L) + '" cy="' + y(d[L].v) + '" r="4.5"/><text class="ch-end" x="' + (x(L) + 8) + '" y="' + (y(d[L].v) + 4) + '">' + d[L].v.toFixed(1) + '</text>';
  s += '<g id="ch-h" style="display:none"><line class="ch-x" id="ch-hl" y1="' + padT + '" y2="' + (H - padB) + '"/><circle class="ch-dot" id="ch-hd" r="5"/></g>';
  s += '<rect id="ch-hit" x="' + padL + '" y="0" width="' + (W - padL - padR) + '" height="' + H + '" fill="transparent"/></svg><div class="tip" id="ch-tip" hidden></div>';
  el.innerHTML = s;
  const hit = $('ch-hit'), g = $('ch-h'), tip = $('ch-tip');
  const show = e => {
    const r = el.getBoundingClientRect();
    const px = e.clientX - r.left;
    const i = Math.max(0, Math.min(L, Math.round((px - padL) / ((W - padL - padR) / L))));
    const p = d[i];
    g.style.display = '';
    $('ch-hl').setAttribute('x1', x(i)); $('ch-hl').setAttribute('x2', x(i));
    $('ch-hd').setAttribute('cx', x(i)); $('ch-hd').setAttribute('cy', y(p.v));
    tip.hidden = false;
    tip.innerHTML = '<b>ср. ' + p.v.toFixed(1) + '</b> · ' + (p.w ? 'победа' : 'поражение') + '<br>' + fmtDate(p.t) + ' · против ' + esc(p.opp);
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, x(i) - tw / 2)) + 'px';
    tip.style.top = Math.max(0, y(p.v) - tip.offsetHeight - 12) + 'px';
  };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { g.style.display = 'none'; tip.hidden = true; });
}

function polar(r, deg) {

}

}
function renderDartboardSVG(recTarget) {

  SECTOR_ORDER.forEach((num, idx) => {

    s += `<path d="${wedgePath(50, 66, a1, a2)}" fill="${cRing}" stroke="#d8c383" stroke-width="0.8" data-hit="${num}|3"${isRec3}><title>T${num} (${num * 3})</title></path>`;
    s += `<path d="${wedgePath(66, 84, a1, a2)}" fill="${cSingle}" stroke="#323833" stroke-width="0.6" data-hit="${num}|1"${isRec1}><title>${num}</title></path>`;
    s += `<path d="${wedgePath(84, 100, a1, a2)}" fill="${cRing}" stroke="#d8c383" stroke-width="0.8" data-hit="${num}|2"${isRec2}><title>D${num} (${num * 2})</title></path>`;

  return s;

function snap() { undo.push(JSON.stringify(G)); if (undo.length > 40) undo.shift(); }

function throwDart(base, mult) {
  if (G.over || G.ask != null) return;
  if (base === 25 && mult === 3) return;
  snap();
  const p = G.players[G.cur];
  const remBefore = p.score - sum(G.visit);
  const isOneDartFinish = routeFor(remBefore, 1, G.dbl) !== null;
  const val = base * mult;
  const label = base === 0 ? '—' : base === 25 ? (mult === 2 ? 'Bull' : '25') : (mult === 1 ? String(base) : (mult === 2 ? 'D' : 'T') + base);
  G.visit.push({ val, m: mult, l: label, coAttempt: isOneDartFinish ? 1 : 0 });
  G.mult = 1; G.note = '';
  const rem = p.score - sum(G.visit);
  const bust = rem < 0 || (G.dbl && (rem === 1 || (rem === 0 && mult !== 2)));
  if (bust) { playSfx('bust'); endVisit(true, false, G.visit.length); G.note = 'Перебор'; }
  else if (rem === 0) { playSfx('win'); endVisit(false, true, G.visit.length); }
  else if (G.visit.length === 3) {
    const tot = sum(G.visit);
    playSfx(tot === 180 ? '180' : 'dart');
    endVisit(false, false, 3);
  } else {
    playSfx('dart');
  }
  saveGame(); render();
}

function endVisit(bust, win, n) {
  const p = G.players[G.cur];
  const start = p.score;
  const pts = bust ? 0 : sum(G.visit);
  if (G.entry === 'total') {
    if (routeFor(start, 3, G.dbl)) p.coa++;
  } else {
    const attempts = G.visit.reduce((acc, d) => acc + (d.coAttempt || 0), 0);
    p.coa += attempts;
  }
  p.darts += n; p.points += pts; p.legDarts += n;
  if (p.legVisits < 3) { p.f9p += pts; p.f9d += n; }
  p.legVisits++;
  p.last = bust ? 'перебор' : String(pts);
  G.log.push({ p: G.cur, leg: G.legNo, s: start, pts, n, b: bust ? 1 : 0, d: G.entry !== 'total' ? G.visit.map(x => x.l) : null });
  G.prev = { i: G.cur, d: G.entry !== 'total' ? G.visit.map(x => x.l) : null, pts, bust };
  if (!bust) {
    p.score -= pts;
    if (pts > p.highest) p.highest = pts;
    if (pts >= 100) p.c100++;
    if (pts >= 140) p.c140++;
    if (pts === 180) p.c180++;
  }
  G.visit = [];
  if (win) {
    if (pts > p.hco) p.hco = pts;
    if (!p.bl || p.legDarts < p.bl) p.bl = p.legDarts;

  else G.over = 'leg';

function submitTotal(pts) {

  if (IMPOSSIBLE.has(pts)) { G.note = pts + ' нельзя набрать тремя дротиками'; return render(); }
  const p = G.players[G.cur];
  const rem = p.score - pts;
  if (rem === 0) {
    if (!routeFor(pts, 3, G.dbl)) { G.note = pts + ' нельзя закрыть ' + (G.dbl ? 'через дубль' : 'тремя дротиками'); return render(); }
    snap(); G.note = ''; G.ask = pts;
    saveGame(); return render();
  }
  snap();
  G.note = '';
  G.visit = [{ val: pts, m: 1, l: String(pts) }];
  if (rem < 0 || (G.dbl && rem === 1)) { playSfx('bust'); endVisit(true, false, 3); G.note = 'Перебор'; }
  else { playSfx(pts === 180 ? '180' : 'dart'); endVisit(false, false, 3); }
  saveGame(); render();
}

  h += '<div class="hint">' + (g.note ? '<span class="note">' + esc(g.note) + '</span>' : (r ? '<span class="route">Закрытие: ' + routeText(r) + '</span>' : '<span class="meta">' + (remNow > 170 ? 'Набираем очки' : 'Закрытия с ' + left + ' др. нет') + '</span>')) + '<span class="meta">подход: <b>' + vs + '</b> · ост. <b>' + remNow + '</b></span></div></div>';

  if (g.ask != null) {
    h += '<div class="ask"><b>Закрытие ' + g.ask + '. Сколько дротиков ушло?</b><span class="meta">Нужно для точного расчёта среднего и лучшего лега.</span><div class="keys3">' + [1, 2, 3].map(n => '<button class="key" data-act="ask" data-v="' + n + '"' + (routeFor(g.ask, n, g.dbl) ? '' : ' disabled') + '>' + n + ' ' + pl(n, 'дротик', 'дротика', 'дротиков') + '</button>').join('') + '</div><button class="ghost" data-act="undo">Отменить ввод</button></div>';
  } else {
    h += '<div class="pad"><div class="seg"><button class="' + (g.entry === 'darts' ? 'on' : '') + '" data-act="entry" data-v="darts">Кнопки</button><button class="' + (g.entry === 'board' ? 'on' : '') + '" data-act="entry" data-v="board">Мишень</button><button class="' + (g.entry === 'total' ? 'on' : '') + '" data-act="entry" data-v="total">Сумма</button><button data-act="undo"' + (undo.length ? '' : ' disabled') + '>Отмена</button></div>';
    if (g.entry === 'darts') {
      const pref = g.mult === 2 ? 'D' : g.mult === 3 ? 'T' : '';
      h += '<div class="seg three"><button class="' + (g.mult === 1 ? 'on' : '') + '" data-act="mult" data-v="1">×1 Одинарный</button><button class="' + (g.mult === 2 ? 'on' : '') + '" data-act="mult" data-v="2">×2 Дубль</button><button class="' + (g.mult === 3 ? 'on' : '') + '" data-act="mult" data-v="3">×3 Трипл</button></div>';
      h += '<div class="keys">';
      for (let n = 1; n <= 20; n++) {
        const isRec = nextTarget && nextTarget.base === n && nextTarget.m === g.mult;
        h += '<button class="key ' + (g.mult === 2 ? 'm2' : g.mult === 3 ? 'm3' : '') + (isRec ? ' rec' : '') + '" data-act="dart" data-v="' + n + '">' + pref + n + '</button>';
      }
      const isRecBull = nextTarget && nextTarget.base === 25 && nextTarget.m === g.mult;
      h += '</div><div class="keys3"><button class="key' + (isRecBull ? ' rec' : '') + '" data-act="dart" data-v="25"' + (g.mult === 3 ? ' disabled' : '') + '>' + (g.mult === 2 ? 'Bull (50)' : '25') + '</button><button class="key" data-act="dart" data-v="0">Мимо (0)</button><button class="key" data-act="undo"' + (undo.length ? '' : ' disabled') + '>Назад</button></div>';
      h += '<div class="kbd-bar"><span>Клавиатура ПК: <kbd>S</kbd> <kbd>D</kbd> <kbd>T</kbd> множитель · <kbd>B</kbd> Bull · <kbd>0</kbd> Мимо · <kbd>Backspace</kbd> Отмена</span></div>';
    } else if (g.entry === 'board') {
      const qBtns = [['all', 'Вся'], ['top', 'Верх (20)'], ['bottom', 'Низ (19/3)'], ['left', 'Лево (11)'], ['right', 'Право (6)']].map(([qv, ql]) => '<button class="mini' + (S.boardQuad === qv ? ' go' : '') + '" data-act="bquad" data-v="' + qv + '">' + ql + '</button>').join('');
      h += '<div class="board-wrap"><div class="board-bar"><span class="label">Зум сектора:</span><div style="display:flex;gap:4px;flex-wrap:wrap">' + qBtns + '</div></div>' + renderDartboardSVG(nextTarget) + '<div class="keys3" style="width:100%"><button class="key" data-act="dart" data-v="0">Мимо (0)</button><button class="key m2" data-act="hit-seg" data-v="25|1">25</button><button class="key m3" data-act="hit-seg" data-v="25|2">Bull (50)</button></div></div>';
    } else {
      h += '<div class="totrow"><input id="tot" type="number" inputmode="numeric" min="0" max="180" step="1" placeholder="0–180" aria-label="Сумма за подход"><button class="btn" data-act="total">Записать</button></div>';
      h += '<div class="presets">' + [0, 26, 41, 45, 60, 81, 85, 100, 140, 180].map(v => '<button class="key" data-act="preset" data-v="' + v + '">' + v + '</button>').join('') + '</div>';
      h += '<div class="kbd-bar"><span>На ПК: введите сумму с клавиатуры и нажмите <kbd>Enter</kbd></span></div>';
    }
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="stats g-stats-area"><table><thead><tr><th>Игрок</th><th>Ср.</th><th>1–9</th><th>Макс.</th><th>180</th><th>Закр.</th></tr></thead><tbody>';
  g.players.forEach(q => { h += '<tr><td>' + esc(q.name) + '</td><td>' + avg3(q.points, q.darts) + '</td><td>' + avg3(q.f9p, q.f9d) + '</td><td>' + (q.highest || '—') + '</td><td>' + q.c180 + '</td><td>' + q.legs + '/' + q.coa + '</td></tr>'; });
  h += '</tbody></table></div></div>';

  if (g.over) {
    const w = g.players[g.winner];
    h += '<div class="over" role="dialog" aria-modal="true"><div class="ocard center"><span class="label">' + (g.over === 'match' ? 'Матч окончен' : 'Лег ' + g.legNo + ' закрыт') + '</span><h2>' + esc(w.name) + (g.over === 'match' ? ' побеждает' : ' берёт лег') + '</h2><div class="score">' + g.players.map(q => '<span>' + esc(q.name) + ' <b>' + q.legs + '</b></span>').join('') + '</div>';
    if (g.over === 'leg') h += '<button class="btn" data-act="next">Следующий лег</button>';
    else {
      if (g.res) h += '<p class="msg">' + esc(g.res.msg) + '</p>';
      h += g.ctx ? '<div class="row2"><button class="btn" data-act="leave" data-v="tour">К турниру</button><button class="btn alt" data-act="leave" data-v="feed">В ленту</button></div>'
        : '<div class="row2"><button class="btn" data-act="rematch">Реванш</button><button class="btn alt" data-act="leave" data-v="feed">В ленту</button></div><button class="ghost" data-act="leave" data-v="play">В меню</button>';
    }
    h += '<button class="ghost" data-act="undo">Отменить последний бросок</button></div></div>';
  }
  return h;
}

function render() {
  $('top').innerHTML = topView();
  $('tabs').innerHTML = tabsView();
  $('modal-root').innerHTML = renderModals();
  CHART = null;
  document.body.classList.toggle('ingame', R === 'play' && S.inGame && !!G);
  app.innerHTML = R === 'feed' ? feedView()
    : R === 'tours' ? toursView()
    : R === 'new' ? newTourView()
    : R.startsWith('t.') ? tourView(R.slice(2))
    : R === 'play' ? playView()
    : R === 'rating' ? ratingView()
    : R.startsWith('p.') ? profileView(R.slice(2))
    : feedView();
  drawChart();
  if (R === 'play' && S.inGame && G && G.entry === 'total' && !G.over && G.ask == null) {
    const totEl = $('tot');
    if (totEl && window.matchMedia('(min-width: 900px)').matches) totEl.focus();
  }
}

document.addEventListener('click', e => {
  if (e.target && e.target.dataset && e.target.dataset.backdrop) {
    S.modalMatch = null; S.quickModal = null; S.confirmModal = null; S.themeModal = false;
    render();
    return;
  }
  const hit = e.target.closest('[data-hit]');
  if (hit && G && !G.over) {
    const [base, mult] = hit.dataset.hit.split('|').map(Number);
    throwDart(base, mult);
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  const su = S.setup;
  const saveSu = () => lsSet('oche2.setup', su);
  switch (a) {
    case 'go': go(v); break;
    case 'theme': S.theme = S.theme === 'dark' ? 'light' : 'dark'; applyTheme(); render(); break;
    case 'set-theme': S.theme = v; applyTheme(); render(); break;
    case 'open-theme': S.themeModal = true; render(); break;
    case 'set-palette': S.palette = v; applyTheme(); render(); break;
    case 'sfx': S.sfx = !S.sfx; lsSet('oche2.sfx', S.sfx); toast(S.sfx ? 'Звук включён' : 'Звук выключен'); render(); break;
    case 'minfo': S.modalMatch = v; render(); break;
    case 'qscore': {
      const [tid, r, i] = v.split('|'), t = TBY[tid];
      if (t) {
        const g = gameAt(t, +r, +i), [a] = gamePlayersIn(t, g);
        S.quickModal = { tid, r: +r, i: +i, la: t.ltw, lb: 0, code: t.official && P[a] ? P[a].code : '', err: '' };
        render();
      }
      break;
    }
    case 'qm-set': {
      if (!S.quickModal) break;
      const [side, val] = v.split('|');
      S.quickModal[side === 'a' ? 'la' : 'lb'] = +val;
      S.quickModal.err = '';
      render(); break;
    }
    case 'qm-fill': if (S.quickModal) { S.quickModal.code = v; S.quickModal.err = ''; render(); } break;
    case 'qm-save': saveQuickTourScore(); break;
    case 'close-modal': S.modalMatch = null; S.quickModal = null; S.confirmModal = null; S.themeModal = false; render(); break;
    case 'launch-tour': launchRegTour(v); break;
    case 'feedf': S.feedF = v; S.feedN = 15; render(); break;
    case 'more': S.feedN += 15; render(); break;
    case 'confirm': {
      const m = MBY[v];
      if (m) {
        const waitList = m.pl.filter(l => l.id && l.id !== m.by).map(l => P[l.id]).filter(Boolean);
        const targetP = waitList[0] || P[m.pl[0].id] || P.me;
        S.confirmModal = { mid: v, code: targetP.code, err: '' };
        render();
      }
      break;
    }
    case 'cm-fill': if (S.confirmModal) { S.confirmModal.code = v; S.confirmModal.err = ''; render(); } break;
    case 'cm-submit': {
      if (!S.confirmModal) break;
      const m = MBY[S.confirmModal.mid];
      if (!m) { S.confirmModal = null; render(); break; }
      const waitList = m.pl.filter(l => l.id && l.id !== m.by).map(l => P[l.id]).filter(Boolean);
      const validCodes = (waitList.length ? waitList : m.pl.map(l => P[l.id]).filter(Boolean)).map(p => p.code.toUpperCase());
      const entered = String(S.confirmModal.code || '').trim().toUpperCase();
      if (!validCodes.includes(entered)) {
        S.confirmModal.err = 'Неверный код Oche ID. Ожидается: ' + validCodes.join(' или ');
        render(); break;
      }
      m.st = 'ok'; S.confirmModal = null; saveDb(); recalc();
      toast('Матч подтверждён кодом игрока ' + entered + '.');
      render(); break;
    }
    case 'copy-code': copyText(v); break;
    case 'regen-code': {
      const num = Math.floor(1000 + Math.random() * 9000);
      P.me.code = 'OCH-' + num;
      saveDb(); toast('Новый личный код: ' + P.me.code); render(); break;
    }
    case 'tf': S.tf = v; render(); break;
    case 'tk': S.tk = v; render(); break;
    case 'ttab': S.ttab = v; render(); break;
    case 'join': {
      const t = TBY[v]; if (!t) break;
      const k = t.players.indexOf('me');
      if (k >= 0) { t.players.splice(k, 1); toast('Запись отменена.'); }
      else if (t.players.length >= t.cap) toast('Мест нет.');
      else { t.players.push('me'); toast('Вы записаны на турнир.'); }
      saveDb(); render(); break;
    }
    case 'tplay': startTourGame(v); break;
    case 'nt-off': S.nt.off = v === '1'; S.nt.err = ''; render(); break;
    case 'nt-fmt': S.nt.fmt = v; S.nt.err = ''; render(); break;
    case 'nt-mode': S.nt.mode = +v; render(); break;
    case 'nt-ltw': S.nt.ltw = +v; render(); break;
    case 'nt-p': { const k = S.nt.sel.indexOf(v); if (k >= 0) S.nt.sel.splice(k, 1); else if (S.nt.sel.length < 16) S.nt.sel.push(v); S.nt.err = ''; render(); break; }
    case 'nt-apply': toast('Заявка отправлена модератору.'); break;
    case 'nt-create': createTour(); break;
    case 'rtab': S.rtab = v; render(); break;
    case 'rcity': S.rcity = v; render(); break;
    case 'pf': S.pf = v; S.pMore = false; render(); break;
    case 'pmore': S.pMore = true; render(); break;
    case 'editname': S.editName = true; render(); { const el = $('me-name'); if (el) el.focus(); } break;
    case 'cancelname': S.editName = false; render(); break;
    case 'savename': {
      const el = $('me-name'), hel = $('me-handle');
      const nv = el ? el.value.trim() : '';
      const hv = hel ? hel.value.trim().replace(/^@+/, '').replace(/[^a-zA-Z0-9_.-]/g, '').toLowerCase() : P.me.handle;
      if (!nv) { toast('Имя не может быть пустым.'); break; }
      if (!hv || hv.length < 3) { toast('Юзернейм должен содержать минимум 3 символа (латиница/цифры).'); break; }
      if (db.players.some(p => p.id !== 'me' && p.handle && p.handle.toLowerCase() === hv)) { toast('Юзернейм @' + hv + ' уже занят.'); break; }
      const old = P.me.name; P.me.name = nv; P.me.handle = hv;
      if (su.names[0] === old) { su.names[0] = nv; saveSu(); }
      saveDb(); S.editName = false; toast('Профиль (@' + hv + ') обновлён.'); render(); break;
    }
    case 'reset': S.confirmReset = true; render(); break;
    case 'reset-no': S.confirmReset = false; render(); break;
    case 'reset-yes':
      db = makeSeed(); saveDb(); recalc();
      G = null; undo = []; S.inGame = false; saveGame();
      S.setup = defaultSetup(); saveSu(); S.confirmReset = false; S.nt = null;
      toast('Демо-данные восстановлены.'); render(); break;
    case 'mode': su.mode = +v; saveSu(); render(); break;
    case 'legs': su.legsToWin = +v; saveSu(); render(); break;
    case 'dbl': su.dbl = v === '1'; saveSu(); render(); break;
    case 'addp': su.names.push(''); render(); { const el = $('pn' + (su.names.length - 1)); if (el) el.focus(); } break;
    case 'delp': su.names.splice(+v, 1); saveSu(); render(); break;
    case 'start': startFromSetup(); break;
    case 'cont': S.inGame = true; render(); break;
    case 'drop': S.confirmDrop = true; render(); break;
    case 'drop-no': S.confirmDrop = false; render(); break;
    case 'drop-yes': G = null; undo = []; S.confirmDrop = false; saveGame(); render(); break;
    case 'menu': S.inGame = false; if (G && G.over === 'match') { G = null; undo = []; } saveGame(); render(); window.scrollTo(0, 0); break;
    case 'leave': leaveMatch(v); break;
    case 'entry':
      if (v === 'total' && G.visit.length > 0) {
        G.visit = []; G.mult = 1;
        toast('Текущий неполный подход сброшен при переходе к вводу суммы.');
      }
      G.entry = v; G.note = ''; saveGame(); render(); break;
    case 'mult': G.mult = G.mult === +v ? 1 : +v; render(); break;
    case 'bquad': S.boardQuad = v; render(); break;
    case 'dart': throwDart(+v, v === '0' ? 1 : G.mult); break;
    case 'hit-seg': { const [base, mult] = v.split('|').map(Number); throwDart(base, mult); break; }
    case 'undo': doUndo(); break;
    case 'total': { const el = $('tot'); submitTotal(el && el.value !== '' ? Number(el.value) : NaN); break; }
    case 'preset': submitTotal(+v); break;
    case 'ask': finishAsk(+v); break;
    case 'next': nextLeg(); break;
    case 'rematch': rematch(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.name !== undefined) {
    const idx = +t.dataset.name;
    S.setup.names[idx] = t.value;
    lsSet('oche2.setup', S.setup);
    const pill = $('pres' + idx);
    if (pill) {
      const matched = resolvePlayer(t.value);
      pill.className = 'p-resolve ' + (matched ? 'ok' : 'guest');
      pill.innerHTML = matched
        ? '<span>✓ Профиль привязан: <b>' + esc(matched.name) + '</b> <span class="uhandle">@' + esc(matched.handle) + '</span></span>' + pCodeBadge(matched.id)
        : '<span>' + ((t.value || '').trim() ? 'Гостевой игрок (не попадёт в клубный рейтинг)' : 'Введите @юзернейм, код OCH-XXXX или выберите из списка') + '</span>';
    }
  }
  if (t.dataset && t.dataset.nt && S.nt) S.nt[t.dataset.nt] = t.value;
  if (t.dataset && t.dataset.qmcode && S.quickModal) S.quickModal.code = t.value;
  if (t.dataset && t.dataset.cmcode && S.confirmModal) S.confirmModal.code = t.value;
  if (t.dataset && t.dataset.rsearch) {
    S.rsearch = t.value;
    const pos = t.selectionStart;
    render();
    const el = $('r-search');
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.modalMatch || S.quickModal || S.confirmModal || S.themeModal)) { S.modalMatch = null; S.quickModal = null; S.confirmModal = null; S.themeModal = false; render(); return; }
  const t = e.target;
  const inInput = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
  if (e.key === 'Enter' && t && t.id === 'tot') { submitTotal(t.value !== '' ? Number(t.value) : NaN); return; }
  if (e.key === 'Enter' && t && t.id === 'me-name') { const sb = $('app').querySelector('[data-act="savename"]'); if (sb) sb.click(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button') { e.preventDefault(); t.click(); return; }

  /* PC Keyboard shortcuts during active game */
  if (!inInput && R === 'play' && S.inGame && G) {
    if (G.over === 'leg' && e.key === 'Enter') { e.preventDefault(); nextLeg(); return; }
    if (!G.over && G.ask == null && G.entry === 'darts') {
      const k = e.key.toLowerCase();
      if (k === 's' || k === 'ы') { G.mult = 1; render(); }
      else if (k === 'd' || k === 'в') { G.mult = G.mult === 2 ? 1 : 2; render(); }
      else if (k === 't' || k === 'е') { G.mult = G.mult === 3 ? 1 : 3; render(); }
      else if (k === 'b' || k === 'и') { if (G.mult !== 3) throwDart(25, G.mult); }
      else if (k === '0') { throwDart(0, 1); }
      else if (e.key === 'Backspace' || k === 'z' || k === 'я') { e.preventDefault(); doUndo(); }
    }
  }
});

function boot(d) {
  applyTheme();
  loadDb();
  const su = lsGet('oche2.setup');
  S.setup = su && Array.isArray(su.names) && su.names.length ? su : defaultSetup();
  const g = lsGet('oche2.game');
  if (g && Array.isArray(g.players) && g.players.length) {
    G = g; undo = lsGet('oche2.undo') || [];
    if (G.ctx && !TBY[G.ctx.tid]) G.ctx = null;
  }
  const h = (d && d.R) || location.hash.slice(1);
  if (h && validRoute(h)) R = h;
  if (d && d.inGame && G) S.inGame = true;
  render();
}
window.onload = function () {
  boot({});
};
</script>
</body>
